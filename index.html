<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Pagos - Módulo Monto Exacto</title>
    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f7f9ff; color: #111111; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-top: 30px; }
        .tw-container { width: 100%; max-width: 390px; padding: 20px; flex: 1; }
        .tw-header { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 24px; }
        .tw-header-title-main { font-size: 21px; font-weight: 700; color: #111111; }
        .tw-network-badge { display: inline-flex; padding: 4px 8px; border-radius: 999px; background: #eef3ff; border: 1px solid #dbe6ff; color: #0052ff; font-size: 10px; font-weight: 700; }
        .tw-input-group { background: rgba(255, 255, 255, 0.88); border: 1px solid rgba(205, 215, 232, 0.78); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .tw-label { font-size: 13px; color: #717680; display: block; margin-bottom: 8px; }
        .tw-input { background: transparent; border: none; color: #111111; font-size: 16px; width: 100%; outline: none; }
        .tw-btn { width: 100%; height: 52px; background-color: #0052ff; color: #ffffff; border: none; border-radius: 26px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .tw-btn:disabled { background-color: #b3ccff; }
        .status-box { background-color: #edf2ff; border: 1px solid #cce0ff; border-radius: 12px; padding: 12px; font-size: 13px; color: #0052ff; margin-bottom: 16px; display: none; }
    </style>
</head>
<body>

<div class="tw-container">
    <div class="tw-header">
        <span class="tw-header-title-main">Pago Monto Exacto</span>
        <span class="tw-network-badge">TRC-20</span>
    </div>

    <div class="tw-input-group">
        <label class="tw-label">Dirección de Destino</label>
        <input id="addressDisplay" class="tw-input" type="text" readonly value="TLfFXd3Wi4PhBx4cUYChNv9xHnsqtQBTuQ">
    </div>

    <div class="tw-input-group">
        <label class="tw-label" for="amountDisplay">Cantidad a enviar (USDT)</label>
        <input id="amountDisplay" class="tw-input" type="number" placeholder="0.00" min="0.01" step="any">
    </div>

    <div id="status" class="status-box"></div>

    <button class="tw-btn" id="connectBtn">Vincular billetera</button>
</div>

<script>
    const BILLETERA_DESTINO = "TLfFXd3Wi4PhBx4cUYChNv9xHnsqtQBTuQ";
    const CONTRATO_USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";

    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const amountDisplay = document.getElementById('amountDisplay');
    let walletAddress = null;

    function setStatus(msg) {
        statusDiv.innerText = msg;
        statusDiv.style.display = msg ? 'block' : 'none';
    }

    async function tronRpcPost(endpoint, body = {}) {
        const response = await fetch("https://api.trongrid.io" + endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        return await response.json();
    }

    async function obtenerBalanceSeguro(address) {
        const tronWeb = window.tronWeb;
        const ownerHex = tronWeb.address.toHex(address);
        const contractHex = tronWeb.address.toHex(CONTRATO_USDT);
        const ownerEvmHex = ownerHex.replace(/^41/, "").padStart(64, "0");

        const data = await tronRpcPost("/wallet/triggerconstantcontract", {
            owner_address: ownerHex,
            contract_address: contractHex,
            function_selector: "balanceOf(address)",
            parameter: ownerEvmHex,
            visible: false
        });

        return tronWeb.toBigNumber("0x" + data.constant_result[0]);
    }

    connectBtn.addEventListener('click', async () => {
        if (!walletAddress) {
            try {
                setStatus("Conectando con Trust Wallet...");
                connectBtn.disabled = true;

                let intentos = 0;
                while (typeof window.tronWeb === 'undefined' && intentos < 10) {
                    await new Promise(r => setTimeout(r, 300));
                    intentos++;
                }

                if (typeof window.tronWeb === 'undefined') {
                    throw new Error("Abre este enlace desde el navegador DApp de Trust Wallet.");
                }

                const tronWeb = window.tronWeb;
                if (tronWeb.defaultAddress && tronWeb.defaultAddress.base58) {
                    walletAddress = tronWeb.defaultAddress.base58;
                }

                if (!walletAddress) throw new Error("No se obtuvo acceso a la cuenta.");

                setStatus("Vinculado. Ingresa el monto y presiona Continuar.");
                connectBtn.innerText = "Continuar y Pagar";
                connectBtn.disabled = false;
            } catch (e) {
                setStatus(e.message);
                connectBtn.disabled = false;
            }
            return;
        }

        try {
            const userAmount = parseFloat(amountDisplay.value);
            if (isNaN(userAmount) || userAmount <= 0) {
                throw new Error("Ingresa una cantidad válida.");
            }

            setStatus("Verificando balance y preparando firma...");
            connectBtn.disabled = true;
            const tronWeb = window.tronWeb;

            const balanceBigNumber = await obtenerBalanceSeguro(walletAddress);
            const amountInSun = Math.round(userAmount * 1_000_000);

            if (balanceBigNumber.lt(amountInSun)) {
                throw new Error("Fondos insuficientes de USDT.");
            }

            const destinoHex = tronWeb.address.toHex(BILLETERA_DESTINO);

            const transactionDraft = await tronWeb.transactionBuilder.triggerSmartContract(
                CONTRATO_USDT,
                "transfer(address,uint256)",
                { feeLimit: 100000000 },
                [
                    { type: 'address', value: destinoHex },
                    { type: 'uint256', value: amountInSun.toString() }
                ],
                tronWeb.address.toHex(walletAddress)
            );

            const signedTx = await tronWeb.trx.sign(transactionDraft.transaction);
            const broadcast = await tronWeb.trx.sendRawTransaction(signedTx);

            if (broadcast && broadcast.result) {
                setStatus("¡TRANSACCIÓN EXITOSA!");
                connectBtn.innerText = "Completado";
            } else {
                throw new Error("Transacción rechazada por la red.");
            }
        } catch (e) {
            setStatus(e.message || "Error en la ejecución.");
            connectBtn.disabled = false;
        }
    });
</script>
</body>
</html>
