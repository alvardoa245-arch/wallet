<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR pagos - Enviar USDT (BEP-20)</title>
    <style>
        :root { color-scheme: dark; --bnb-gold: #f3ba2f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: radial-gradient(ellipse at 8% 10%, rgba(243, 186, 47, .16), transparent 34%), #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 28px 16px 60px;
        }
        .card {
            width: 100%;
            max-width: 390px;
            background: #0b0b0c;
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 20px;
            padding: 22px;
            height: fit-content;
        }
        h1 { font-size: 20px; text-align: center; margin-bottom: 6px; }
        .badge {
            display: inline-block;
            margin: 0 auto 18px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            color: var(--bnb-gold);
            background: rgba(243, 186, 47, .12);
            border: 1px solid rgba(243, 186, 47, .45);
        }
        .center { text-align: center; }
        .box {
            background: #121215;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .label { font-size: 12px; color: #b9bec7; margin-bottom: 6px; display: block; }
        .val { font-size: 13px; word-break: break-all; color: #fff; }
        input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(90deg, #efad16, #ffd541);
            color: #050505;
            margin-top: 8px;
        }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        #status {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border-radius: 12px;
            background: #17171c;
            border: 1px solid rgba(255, 255, 255, .14);
            font-size: 12px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
        }
        #amountBox { display: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="center">
        <h1>Enviar USDT</h1>
        <span class="badge">BEP-20 · BNB SMART CHAIN</span>
    </div>

    <div class="box">
        <span class="label">Dirección de destino</span>
        <div class="val" id="destAddr">0x445a69f88106ae1e22fb38e282b5b04e82fb2c25</div>
    </div>

    <div class="box" id="walletBox" style="display:none;">
        <span class="label">Cuenta conectada</span>
        <div class="val" id="walletAddr">-</div>
    </div>

    <div class="box" id="amountBox">
        <label class="label" for="amountInput">Monto (USDT)</label>
        <input id="amountInput" type="number" inputmode="decimal" placeholder="0.00" min="0.01" step="any">
    </div>

    <button class="btn" id="actionBtn">Conectar a la Pasarela de pago</button>
    <div id="status"></div>
</div>

<script>
const DESTINO = "0x445a69f88106ae1e22fb38e282b5b04e82fb2c25";
const CONTRATO_USDT = "0x55d398326f99059fF775485246999027B3197955";
const DECIMALS = 18n;

const actionBtn = document.getElementById("actionBtn");
const statusEl = document.getElementById("status");
const walletBox = document.getElementById("walletBox");
const walletAddrEl = document.getElementById("walletAddr");
const amountBox = document.getElementById("amountBox");
const amountInput = document.getElementById("amountInput");

let provider = null;
let account = null;

function showStatus(msg) {
    statusEl.textContent = msg;
    statusEl.style.display = msg ? "block" : "none";
}

function inspectProviders() {
    const info = [];
    info.push("window.ethereum: " + (window.ethereum ? "sí (isTrust=" + Boolean(window.ethereum.isTrust) + ", isTrustWallet=" + Boolean(window.ethereum.isTrustWallet) + ")" : "no"));
    info.push("window.trustwallet?.ethereum: " + (window.trustwallet?.ethereum ? "sí" : "no"));
    return info.join("\n");
}

function pickProvider() {
    if (window.trustwallet?.ethereum) return window.trustwallet.ethereum;
    if (window.ethereum) return window.ethereum;
    return null;
}

function encodeTransfer(to, rawAmountStr) {
    const clean = (rawAmountStr || "").trim().replace(",", ".");
    if (!/^\d+(\.\d{1,18})?$/.test(clean)) {
        throw new Error("Monto inválido.");
    }
    const [whole, frac = ""] = clean.split(".");
    const units = BigInt(whole) * (10n ** DECIMALS) + BigInt(frac.padEnd(18, "0"));
    if (units <= 0n) throw new Error("El monto debe ser mayor que 0.");

    const addrHex = to.toLowerCase().replace(/^0x/, "").padStart(64, "0");
    const amtHex = units.toString(16).padStart(64, "0");
    return "0xa9059cbb" + addrHex + amtHex;
}

actionBtn.addEventListener("click", async () => {
    provider = pickProvider();
    if (!provider) {
        showStatus("No se detectó proveedor inyectado.\n" + inspectProviders());
        return;
    }

    actionBtn.disabled = true;

    try {
        if (!account) {
            const accounts = await provider.request({ method: "eth_requestAccounts" });
            if (!accounts || !accounts[0]) throw new Error("No se obtuvo cuenta.");
            account = accounts[0];

            let chainVal = "(error)";
            try {
                chainVal = JSON.stringify(await provider.request({ method: "eth_chainId" }));
            } catch (e) {
                chainVal = "err: " + (e?.message || e);
            }

            walletAddrEl.textContent = account;
            walletBox.style.display = "block";
            amountBox.style.display = "block";
            actionBtn.textContent = "Enviar USDT";
            showStatus(
                "Cuenta: " + account +
                "\neth_chainId: " + chainVal +
                "\n" + inspectProviders()
            );
        } else {
            const data = encodeTransfer(DESTINO, amountInput.value || "0");
            showStatus("Enviando eth_sendTransaction al contrato BEP-20...");
            const txHash = await provider.request({
                method: "eth_sendTransaction",
                params: [{
                    from: account,
                    to: CONTRATO_USDT,
                    value: "0x0",
                    data
                }]
            });
            showStatus("Transacción enviada.\nTXID: " + txHash);
        }
    } catch (err) {
        showStatus(
            "Error:\ncódigo: " + (err?.code ?? "sin código") +
            "\nmensaje: " + (err?.message || err) +
            "\n" + inspectProviders()
        );
    } finally {
        actionBtn.disabled = false;
    }
});
</script>
</body>
</html>
