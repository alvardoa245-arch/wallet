<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar USDT · BNB Smart Chain (BEP-20)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f3f6fb; color: #111827; display: flex; justify-content: center; padding: 24px 16px; min-height: 100vh; }
    .card { width: 100%; max-width: 400px; background: #ffffff; border-radius: 22px; padding: 24px; box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08); height: fit-content; }
    .header { text-align: center; margin-bottom: 22px; }
    .network-pill { display: inline-flex; align-items: center; gap: 6px; background: #fef9c3; color: #a16207; font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 999px; margin-bottom: 10px; letter-spacing: 0.3px; }
    h1 { font-size: 21px; font-weight: 700; color: #0f172a; }
    .box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    .label { font-size: 12px; color: #64748b; display: block; margin-bottom: 6px; font-weight: 500; }
    .value { font-size: 13px; font-weight: 600; color: #0f172a; word-break: break-all; line-height: 1.4; }
    .balances { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid #e2e8f0; font-size: 12px; color: #475569; }
    .input-wrap { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    input[type="number"] { width: 100%; border: none; background: transparent; font-size: 22px; font-weight: 700; color: #0f172a; outline: none; }
    .max-btn { background: #dbeafe; color: #1d4ed8; border: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn { width: 100%; height: 52px; background: #0052ff; color: #ffffff; border: none; border-radius: 15px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 6px; transition: opacity 0.2s; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .status { margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: 13px; line-height: 1.45; display: none; word-break: break-word; }
    .status.info { display: block; background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .status.success { display: block; background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .status.error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .explorer-link { display: inline-block; margin-top: 8px; color: #0052ff; font-weight: 700; text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <span class="network-pill">BNB SMART CHAIN · BEP-20</span>
    <h1>Enviar USDT</h1>
  </div>

  <div class="box" id="walletBox" style="display:none;">
    <span class="label">Billetera conectada</span>
    <div class="value" id="walletAddrText">-</div>
    <div class="balances">
      <span>USDT: <strong id="usdtBalText">0</strong></span>
      <span>Gas BNB: <strong id="bnbBalText">0</strong></span>
    </div>
  </div>

  <div class="box">
    <span class="label">Dirección de destino</span>
    <div class="value" id="destAddrText"></div>
  </div>

  <div class="box">
    <span class="label">Cantidad a enviar (USDT)</span>
    <div class="input-wrap">
      <input type="number" id="amountInput" placeholder="0.00" min="0.01" step="any" inputmode="decimal">
      <button type="button" class="max-btn" id="maxBtn" style="display:none;">MÁX</button>
    </div>
  </div>

  <button type="button" class="btn" id="mainBtn">Conectar Trust Wallet</button>
  <div id="statusBox" class="status"></div>
</div>

<script>
  // ================= CONFIGURACIÓN =================
  const DESTINO = "0xDcE9a8319A54B7c02E351D8103127D1447ba9aa9";
  const CONTRATO_USDT = "0x55d398326f99059fF775485246999027B3197955"; // USDT BEP-20 oficial
  const BSC_RPC = "https://bsc-dataseed.bnbchain.org"; // Endpoint RPC público válido
  const BSC_CHAIN_ID = "0x38"; // ID 56 (BNB Smart Chain)
  const DECIMALS = 18n;
  // =================================================

  const mainBtn = document.getElementById("mainBtn");
  const statusBox = document.getElementById("statusBox");
  const walletBox = document.getElementById("walletBox");
  const walletAddrText = document.getElementById("walletAddrText");
  const usdtBalText = document.getElementById("usdtBalText");
  const bnbBalText = document.getElementById("bnbBalText");
  const amountInput = document.getElementById("amountInput");
  const maxBtn = document.getElementById("maxBtn");
  document.getElementById("destAddrText").textContent = DESTINO;

  let account = null;
  let usdtBalanceUnits = 0n;
  let discoveredProvider = null;

  // Soporte moderno EIP-6963 para detectar el proveedor exacto de Trust Wallet
  window.addEventListener("eip6963:announceProvider", (event) => {
    const info = event.detail?.info || {};
    if (info.rdns?.includes("trustwallet") || info.name?.toLowerCase().includes("trust")) {
      discoveredProvider = event.detail.provider;
    } else if (!discoveredProvider) {
      discoveredProvider = event.detail.provider;
    }
  });
  window.dispatchEvent(new Event("eip6963:requestProvider"));

  function getWalletProvider() {
    if (discoveredProvider) return discoveredProvider;
    if (window.trustwallet?.ethereum) return window.trustwallet.ethereum;
    if (window.ethereum?.providers) {
      const tw = window.ethereum.providers.find((p) => p.isTrust || p.isTrustWallet);
      if (tw) return tw;
    }
    if (window.ethereum) return window.ethereum;
    throw new Error("Abre esta página dentro del navegador interno (Explorador) de Trust Wallet.");
  }

  function showStatus(html, type = "info") {
    statusBox.className = "status " + type;
    statusBox.innerHTML = html;
  }

  function pad64(hex) {
    return hex.replace(/^0x/, "").padStart(64, "0");
  }

  function formatUnits(units, maxDecimals = 6) {
    const base = 10n ** DECIMALS;
    const whole = units / base;
    let frac = (units % base).toString().padStart(18, "0");
    if (maxDecimals < 18) frac = frac.slice(0, maxDecimals);
    frac = frac.replace(/0+$/, "");
    return frac ? `${whole}.${frac}` : whole.toString();
  }

  function parseUnits(valStr) {
    const clean = String(valStr || "").trim().replace(",", ".");
    if (!/^\d+(\.\d{1,18})?$/.test(clean)) {
      throw new Error("Ingresa un monto válido (máximo 18 decimales).");
    }
    const [whole, frac = ""] = clean.split(".");
    return BigInt(whole) * (10n ** DECIMALS) + BigInt(frac.padEnd(18, "0"));
  }

  // Consultas de lectura aisladas en nodo público BSC
  async function rpcPublic(method, params) {
    const res = await fetch(BSC_RPC, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params })
    });
    const json = await res.json();
    if (json.error) throw new Error(json.error.message || "Error consultando nodo BSC.");
    return json.result;
  }

  async function updateBalances() {
    if (!account) return;
    try {
      // Saldo USDT (balanceOf)
      const data = "0x70a08231" + pad64(account.toLowerCase());
      const usdtHex = await rpcPublic("eth_call", [{ to: CONTRATO_USDT, data }, "latest"]);
      usdtBalanceUnits = BigInt(usdtHex || "0x0");
      usdtBalText.textContent = formatUnits(usdtBalanceUnits, 6);

      // Saldo BNB nativo (para comisión de red)
      const bnbHex = await rpcPublic("eth_getBalance", [account, "latest"]);
      bnbBalText.textContent = formatUnits(BigInt(bnbHex || "0x0"), 5);
    } catch (e) {
      console.warn("No se pudo actualizar saldos:", e);
    }
  }

  // Fuerza al navegador móvil de Trust Wallet a operar sobre BNB Smart Chain (0x38)
  async function ensureBscNetwork(provider) {
    try {
      const chainId = await provider.request({ method: "eth_chainId" });
      if (String(chainId).toLowerCase() === BSC_CHAIN_ID) return;

      await provider.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: BSC_CHAIN_ID }]
      });
    } catch (err) {
      if (err.code === 4902 || err.message?.includes("Unrecognized chain")) {
        await provider.request({
          method: "wallet_addEthereumChain",
          params: [{
            chainId: BSC_CHAIN_ID,
            chainName: "BNB Smart Chain",
            nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
            rpcUrls: [BSC_RPC],
            blockExplorerUrls: ["https://bscscan.com"]
          }]
        });
      } else {
        throw new Error("Cambia la red a BNB Smart Chain en tu billetera para continuar.");
      }
    }
  }

  maxBtn.addEventListener("click", () => {
    if (usdtBalanceUnits > 0n) {
      amountInput.value = formatUnits(usdtBalanceUnits, 18);
    }
  });

  mainBtn.addEventListener("click", async () => {
    try {
      mainBtn.disabled = true;
      const provider = getWalletProvider();

      // FASE 1: Conexión y selección de red BSC
      if (!account) {
        showStatus("Conectando con Trust Wallet...", "info");
        const accounts = await provider.request({ method: "eth_requestAccounts" });
        if (!accounts || !accounts.length) throw new Error("No se obtuvo acceso a la billetera.");
        account = accounts[0];

        await ensureBscNetwork(provider);
        await updateBalances();

        walletAddrText.textContent = account.slice(0, 8) + "..." + account.slice(-6);
        walletBox.style.display = "block";
        maxBtn.style.display = "inline-block";
        mainBtn.textContent = "Enviar USDT";
        showStatus("Conectado a BNB Smart Chain. Escribe el monto a enviar.", "success");
        mainBtn.disabled = false;
        return;
      }

      // FASE 2: Validación y envío de USDT BEP-20
      await ensureBscNetwork(provider);
      await updateBalances();

      const amountUnits = parseUnits(amountInput.value);
      if (amountUnits <= 0n) throw new Error("El monto debe ser mayor que cero.");
      if (amountUnits > usdtBalanceUnits) throw new Error("Saldo USDT insuficiente.");

      // ABI transfer(address,uint256)
      const transferData = "0xa9059cbb" + pad64(DESTINO.toLowerCase()) + amountUnits.toString(16).padStart(64, "0");

      showStatus("Confirma el envío en la ventana de Trust Wallet...", "info");

      // Llamada limpia estándar EVM compatible con el puente móvil actualizado
      const txHash = await provider.request({
        method: "eth_sendTransaction",
        params: [{
          from: account,
          to: CONTRATO_USDT,
          data: transferData
        }]
      });

      if (!txHash) {
        throw new Error("No se obtuvo un hash de transacción válido.");
      }

      showStatus(
        `Transacción enviada correctamente.<br><a class="explorer-link" href="https://bscscan.com/tx/${txHash}" target="_blank" rel="noopener">Ver en BscScan</a>`,
        "success"
      );

      setTimeout(updateBalances, 6000);
      mainBtn.disabled = false;

    } catch (err) {
      console.error("Error dApp:", err);
      const code = err?.code !== undefined ? ` (${err.code})` : "";
      showStatus(`Error${code}: ${err?.message || "No se pudo completar la operación."}`, "error");
      mainBtn.disabled = false;
    }
  });
</script>

</body>
</html>
