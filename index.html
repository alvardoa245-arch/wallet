<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectar dApp a BNB Smart Chain</title>
</head>
<body>

    <div style="text-align: center; margin-top: 50px;">
        <h2>Conectar Trust Wallet a BNB Smart Chain</h2>
        <button id="connectBtn" style="padding: 12px 24px; font-size: 16px; cursor: pointer;">
            Conectar Billetera
        </button>
        <p id="status" style="margin-top: 20px; font-weight: bold;"></p>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const statusText = document.getElementById('status');

        // Chain ID de BNB Smart Chain Mainnet en hexadecimal es 0x38 (56 en decimal)
        const BSC_CHAIN_ID = '0x38'; 

        async function connectWallet() {
            // Verificar si el navegador tiene inyectado un proveedor Web3 (Trust Wallet / MetaMask)
            if (typeof window.ethereum !== 'undefined') {
                try {
                    statusText.innerText = "Conectando...";
                    
                    // 1. Solicitar cuentas al usuario
                    const accounts = await window.ethereum.request({ 
                        method: 'eth_requestAccounts' 
                    });
                    
                    const userAddress = accounts[0];
                    statusText.innerText = `Conectado: ${userAddress.substring(0, 6)}...`;

                    // 2. Verificar y cambiar a la red BNB Smart Chain
                    await switchToBNBChain();

                } catch (error) {
                    console.error("Error al conectar:", error);
                    statusText.innerText = "Conexión rechazada o error en el proceso.";
                }
            } else {
                alert("No se detectó ninguna billetera Web3. Por favor, abre esta dApp desde el navegador interno de Trust Wallet.");
                statusText.innerText = "Billetera no detectada.";
            }
        }

        async function switchToBNBChain() {
            try {
                // Intentar cambiar a BNB Smart Chain
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: BSC_CHAIN_ID }],
                });
                statusText.innerText += " | ¡Conectado a BNB Smart Chain!";
            } catch (switchError) {
                // Si la red no está agregada en la billetera del usuario (código 4902), la agregamos
                if (switchError.code === 4902) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [
                                {
                                    chainId: BSC_CHAIN_ID,
                                    chainName: 'BNB Smart Chain Mainnet',
                                    nativeCurrency: {
                                        name: 'BNB',
                                        symbol: 'BNB',
                                        decimals: 18
                                    },
                                    rpcUrls: ['https://bsc-dataseed.binance.org/'],
                                    blockExplorerUrls: ['https://bscscan.com/']
                                },
                            ],
                        });
                        statusText.innerText += " | Red BSC agregada y conectada con éxito.";
                    } catch (addError) {
                        console.error("El usuario rechazó agregar la red:", addError);
                        statusText.innerText = "Error: Debes aceptar cambiar a la red BNB Smart Chain.";
                    }
                } else {
                    console.error("No se pudo cambiar de red:", switchError);
                }
            }
        }

        // Evento del botón
        connectBtn.addEventListener('click', connectWallet);

        // Opcional: Escuchar cambios de red o de cuenta en tiempo real
        if (window.ethereum) {
            window.ethereum.on('chainChanged', (chainId) => {
                // Es recomendable recargar la página cuando cambia la red para evitar estados desincronizados
                window.location.reload();
            });

            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length === 0) {
                    statusText.innerText = "Billetera desconectada.";
                } else {
                    statusText.innerText = `Cuenta activa: ${accounts[0].substring(0, 6)}...`;
                }
            });
        }
    </script>
</body>
</html>
