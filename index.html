<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR pagos - Enviar USDT (BEP-20)</title>
    <style>
        :root { color-scheme: dark; --bnb-gold: #f3ba2f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: radial-gradient(ellipse at 8% 10%, rgba(243, 186, 47, .16), transparent 34%), #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 28px 16px 60px;
        }
        .card {
            width: 100%;
            max-width: 390px;
            background: #0b0b0c;
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 20px;
            padding: 22px;
            height: fit-content;
        }
        h1 { font-size: 20px; text-align: center; margin-bottom: 6px; }
        .badge {
            display: inline-block;
            margin: 0 auto 18px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            color: var(--bnb-gold);
            background: rgba(243, 186, 47, .12);
            border: 1px solid rgba(243, 186, 47, .45);
        }
        .center { text-align: center; }
        .box {
            background: #121215;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .label { font-size: 12px; color: #b9bec7; margin-bottom: 6px; display: block; }
        .val { font-size: 13px; word-break: break-all; color: #fff; }
        input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(90deg, #efad16, #ffd541);
            color: #050505;
            margin-top: 8px;
        }
        .btn-secondary {
            width: 100%;
            height: 48px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: #18181d;
            color: var(--bnb-gold);
            border: 1px solid rgba(243, 186, 47, .5);
            margin-top: 10px;
        }
        .btn:disabled, .btn-secondary:disabled { opacity: .6; cursor: not-allowed; }
        #status {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border-radius: 12px;
            background: #17171c;
            border: 1px solid rgba(255, 255, 255, .14);
            font-size: 12px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
        }
        #amountBox { display: none; }
        #wcUriBox { display: none; }
        .uri-link {
            display: block;
            margin-top: 8px;
            color: var(--bnb-gold);
            font-size: 12px;
            word-break: break-all;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="center">
        <h1>Enviar USDT</h1>
        <span class="badge">BEP-20 · BNB SMART CHAIN</span>
    </div>

    <div class="box">
        <span class="label">Dirección de destino</span>
        <div class="val" id="destAddr">0x445a69f88106ae1e22fb38e282b5b04e82fb2c25</div>
    </div>

    <div class="box" id="walletBox" style="display:none;">
        <span class="label">Cuenta conectada</span>
        <div class="val" id="walletAddr">-</div>
    </div>

    <div class="box" id="amountBox">
        <label class="label" for="amountInput">Monto (USDT)</label>
        <input id="amountInput" type="number" inputmode="decimal" placeholder="0.00" min="0.01" step="any">
    </div>

    <button class="btn" id="injectedBtn">Conectar a la Pasarela de pago</button>
    <button class="btn-secondary" id="wcBtn">Conectar con WalletConnect (BSC)</button>

    <div class="box" id="wcUriBox" style="margin-top:12px;">
        <span class="label">Enlace / URI de WalletConnect</span>
        <div class="val" id="wcUriText"></div>
        <a class="uri-link" id="wcOpenLink" href="#">Abrir en billetera</a>
    </div>

    <div id="status"></div>
</div>

<script type="module">
import { EthereumProvider } from "https://esm.sh/@walletconnect/ethereum-provider@2.17.4";

const PROJECT_ID = "A17afbbd1f02959137d6676f23428369";
const DESTINO = "0x445a69f88106ae1e22fb38e282b5b04e82fb2c25";
const CONTRATO_USDT = "0x55d398326f99059fF775485246999027B3197955";
const BSC_CHAIN_ID_HEX = "0x38";
const BSC_CHAIN_ID_NUM = 56;
const DECIMALS = 18n;

const injectedBtn = document.getElementById("injectedBtn");
const wcBtn = document.getElementById("wcBtn");
const statusEl = document.getElementById("status");
const walletBox = document.getElementById("walletBox");
const walletAddrEl = document.getElementById("walletAddr");
const amountBox = document.getElementById("amountBox");
const amountInput = document.getElementById("amountInput");
const wcUriBox = document.getElementById("wcUriBox");
const wcUriText = document.getElementById("wcUriText");
const wcOpenLink = document.getElementById("wcOpenLink");

let activeProvider = null;
let account = null;
let wcProvider = null;

function showStatus(msg) {
    statusEl.textContent = msg;
    statusEl.style.display = msg ? "block" : "none";
}

function getInjectedProvider() {
    if (window.ethereum) return window.ethereum;
    if (window.trustwallet?.ethereum) return window.trustwallet.ethereum;
    return null;
}

function isBSC(val) {
    if (!val) return false;
    const s = String(val).trim().toLowerCase();
    return s === "0x38" || s === "56";
}

function encodeTransfer(to, rawAmountStr) {
    const clean = rawAmountStr.trim().replace(",", ".");
    if (!/^\d+(\.\d{1,18})?$/.test(clean)) {
        throw new Error("Monto inválido.");
    }
    const [whole, frac = ""] = clean.split(".");
    const units = BigInt(whole) * (10n ** DECIMALS) + BigInt(frac.padEnd(18, "0"));
    if (units <= 0n) throw new Error("El monto debe ser mayor que 0.");

    const addrHex = to.toLowerCase().replace(/^0x/, "").padStart(64, "0");
    const amtHex = units.toString(16).padStart(64, "0");
    return "0xa9059cbb" + addrHex + amtHex;
}

function setConnectedUI(addr, chainVal, modeLabel) {
    account = addr;
    walletAddrEl.textContent = addr;
    walletBox.style.display = "block";
    amountBox.style.display = "block";
    injectedBtn.textContent = "Enviar USDT";
    wcBtn.style.display = "none";
    showStatus("Conectado (" + modeLabel + "):\n" + addr + "\nRed: " + JSON.stringify(chainVal));
}

async function sendUSDT() {
    if (!activeProvider || !account) {
        throw new Error("Primero conecta tu billetera.");
    }
    const chainNow = await activeProvider.request({ method: "eth_chainId" });
    if (!isBSC(chainNow)) {
        throw new Error("La sesión activa está en " + JSON.stringify(chainNow) + " y no en BNB Smart Chain (0x38).");
    }
    const data = encodeTransfer(DESTINO, amountInput.value || "0");
    showStatus("Enviando transacción USDT (BEP-20)...");
    const txHash = await activeProvider.request({
        method: "eth_sendTransaction",
        params: [{
            from: account,
            to: CONTRATO_USDT,
            value: "0x0",
            data
        }]
    });
    showStatus("Transacción enviada.\nTXID: " + txHash);
}

injectedBtn.addEventListener("click", async () => {
    if (account && activeProvider) {
        injectedBtn.disabled = true;
        try {
            await sendUSDT();
        } catch (err) {
            showStatus("Error al enviar:\ncódigo: " + (err?.code ?? "sin código") + "\nmensaje: " + (err?.message || err));
        } finally {
            injectedBtn.disabled = false;
        }
        return;
    }

    const provider = getInjectedProvider();
    if (!provider) {
        showStatus("No se detectó proveedor inyectado. Usa WalletConnect o abre en el navegador de Trust Wallet.");
        return;
    }

    injectedBtn.disabled = true;
    try {
        const accounts = await provider.request({ method: "eth_requestAccounts" });
        if (!accounts || !accounts[0]) throw new Error("No se obtuvo ninguna cuenta.");
        const chainNow = await provider.request({ method: "eth_chainId" });
        activeProvider = provider;
        setConnectedUI(accounts[0], chainNow, "Proveedor inyectado");
        if (!isBSC(chainNow)) {
            showStatus(
                statusEl.textContent +
                "\nNota: la red actual reportada es " + JSON.stringify(chainNow) + " (no 0x38)."
            );
        }
    } catch (err) {
        showStatus("Error proveedor inyectado:\ncódigo: " + (err?.code ?? "sin código") + "\nmensaje: " + (err?.message || err));
    } finally {
        injectedBtn.disabled = false;
    }
});

wcBtn.addEventListener("click", async () => {
    wcBtn.disabled = true;
    try {
        showStatus("Inicializando WalletConnect para BNB Smart Chain (56)...");
        if (!wcProvider) {
            wcProvider = await EthereumProvider.init({
                projectId: PROJECT_ID,
                chains: [BSC_CHAIN_ID_NUM],
                optionalChains: [BSC_CHAIN_ID_NUM],
                rpcMap: {
                    [BSC_CHAIN_ID_NUM]: "https://bsc-dataseed.bnbchain.org/"
                },
                showQrModal: true,
                metadata: {
                    name: "QR pagos - Enviar USDT (BEP-20)",
                    description: "Pasarela de pago USDT BEP-20 en BNB Smart Chain",
                    url: window.location.origin,
                    icons: ["https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg"]
                }
            });

            wcProvider.on("display_uri", (uri) => {
                wcUriText.textContent = uri;
                wcOpenLink.href = uri;
                wcUriBox.style.display = "block";
            });
        }

        const accounts = await wcProvider.enable();
        if (!accounts || !accounts[0]) throw new Error("No se obtuvo cuenta desde WalletConnect.");
        const chainId = await wcProvider.request({ method: "eth_chainId" });
        activeProvider = wcProvider;
        wcUriBox.style.display = "none";
        setConnectedUI(accounts[0], chainId, "WalletConnect");
    } catch (err) {
        showStatus("Error WalletConnect:\ncódigo: " + (err?.code ?? "sin código") + "\nmensaje: " + (err?.message || err));
    } finally {
        wcBtn.disabled = false;
    }
});
</script>
</body>
</html>
