<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar USDT - BNB Smart Chain (BEP-20)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f7fb; color: #111; display: flex; justify-content: center; padding: 24px 16px; min-height: 100vh; }
    .card { width: 100%; max-width: 400px; background: #fff; border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0, 35, 90, 0.08); height: fit-content; }
    .header { text-align: center; margin-bottom: 20px; }
    .badge { display: inline-block; background: #fef6d8; color: #b78103; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-bottom: 8px; }
    h1 { font-size: 20px; font-weight: 700; }
    .field { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    .label { font-size: 12px; color: #64748b; display: block; margin-bottom: 6px; }
    .value { font-size: 14px; font-weight: 600; word-break: break-all; color: #0f172a; }
    .input-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    input[type="number"] { width: 100%; border: none; background: transparent; font-size: 20px; font-weight: 700; outline: none; color: #0f172a; }
    .max-btn { background: #e0e7ff; color: #0052ff; border: none; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn { width: 100%; height: 50px; background: #0052ff; color: #fff; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: opacity 0.2s; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .status { margin-top: 14px; padding: 12px; border-radius: 12px; font-size: 13px; line-height: 1.4; display: none; word-break: break-word; }
    .status.info { display: block; background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .status.error { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .status.success { display: block; background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .tx-link { display: inline-block; margin-top: 6px; color: #0052ff; font-weight: 700; text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <span class="badge">BNB SMART CHAIN · BEP-20</span>
    <h1>Enviar USDT</h1>
  </div>

  <div class="field" id="walletBox" style="display:none;">
    <span class="label">Billetera conectada</span>
    <div class="value" id="walletText">-</div>
    <div style="margin-top:6px; font-size:12px; color:#475569;">
      Saldo disponible: <strong id="usdtBalance">0</strong> USDT
    </div>
  </div>

  <div class="field">
    <span class="label">Dirección de destino</span>
    <div class="value" id="destText"></div>
  </div>

  <div class="field">
    <span class="label">Monto a enviar (USDT)</span>
    <div class="input-row">
      <input type="number" id="amountInput" placeholder="0.00" min="0.01" step="any" inputmode="decimal">
      <button type="button" class="max-btn" id="maxBtn" style="display:none;">MÁX</button>
    </div>
  </div>

  <button type="button" class="btn" id="actionBtn">Conectar Trust Wallet</button>
  <div id="statusBox" class="status"></div>
</div>

<script>
  // ================= CONFIGURACIÓN =================
  const DESTINO = "0x445a69f88106ae1e22fb38e282b5b04e82fb2c25";
  const CONTRATO_USDT = "0x55d398326f99059fF775485246999027B3197955"; // USDT oficial BEP-20
  const BSC_RPC = "https://bsc-dataseed.bnbchain.org";
  const DECIMALS = 18n;
  // =================================================

  const actionBtn = document.getElementById("actionBtn");
  const statusBox = document.getElementById("statusBox");
  const walletBox = document.getElementById("walletBox");
  const walletText = document.getElementById("walletText");
  const usdtBalanceEl = document.getElementById("usdtBalance");
  const amountInput = document.getElementById("amountInput");
  const maxBtn = document.getElementById("maxBtn");
  document.getElementById("destText").textContent = DESTINO;

  let userAddress = null;
  let userBalanceUnits = 0n;
  let eip6963Provider = null;

  window.addEventListener("eip6963:announceProvider", (event) => {
    const info = event.detail?.info || {};
    if (info.rdns?.includes("trustwallet") || info.name?.toLowerCase().includes("trust")) {
      eip6963Provider = event.detail.provider;
    } else if (!eip6963Provider) {
      eip6963Provider = event.detail.provider;
    }
  });
  window.dispatchEvent(new Event("eip6963:requestProvider"));

  function getProvider() {
    if (eip6963Provider) return eip6963Provider;
    if (window.trustwallet?.ethereum) return window.trustwallet.ethereum;
    if (window.ethereum?.providers) {
      const tw = window.ethereum.providers.find((p) => p.isTrust || p.isTrustWallet);
      if (tw) return tw;
    }
    if (window.ethereum) return window.ethereum;
    throw new Error("No se detectó Trust Wallet. Abre este enlace dentro del navegador interno de la app.");
  }

  function setStatus(msg, type = "info") {
    statusBox.className = "status " + type;
    statusBox.innerHTML = msg;
  }

  function pad64(hex) {
    return hex.replace(/^0x/, "").padStart(64, "0");
  }

  function formatUnits(units) {
    const base = 10n ** DECIMALS;
    const whole = units / base;
    const frac = (units % base).toString().padStart(18, "0").replace(/0+$/, "");
    return frac ? `${whole}.${frac}` : whole.toString();
  }

  function parseUnits(amountStr) {
    const clean = String(amountStr).trim().replace(",", ".");
    if (!/^\d+(\.\d{1,18})?$/.test(clean)) {
      throw new Error("Ingresa un monto válido (máximo 18 decimales).");
    }
    const [whole, frac = ""] = clean.split(".");
    return BigInt(whole) * (10n ** DECIMALS) + BigInt(frac.padEnd(18, "0").slice(0, 18));
  }

  async function bscRead(method, params) {
    const res = await fetch(BSC_RPC, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || "Error consultando la red BSC");
    return data.result;
  }

  async function refreshBalance() {
    if (!userAddress) return;
    try {
      const callData = "0x70a08231" + pad64(userAddress);
      const hexBal = await bscRead("eth_call", [{ to: CONTRATO_USDT, data: callData }, "latest"]);
      userBalanceUnits = BigInt(hexBal || "0x0");
      usdtBalanceEl.textContent = formatUnits(userBalanceUnits);
    } catch (e) {
      console.warn("No se pudo actualizar el balance:", e);
    }
  }

  maxBtn.addEventListener("click", () => {
    if (userBalanceUnits > 0n) {
      amountInput.value = formatUnits(userBalanceUnits);
    }
  });

  actionBtn.addEventListener("click", async () => {
    try {
      actionBtn.disabled = true;
      const provider = getProvider();

      // PASO 1: Conexión directa y libre de bloqueos de red (igual que funcionó antes)
      if (!userAddress) {
        setStatus("Conectando con Trust Wallet...", "info");
        const accounts = await provider.request({ method: "eth_requestAccounts" });
        if (!accounts || !accounts.length) throw new Error("No se autorizó ninguna cuenta.");
        userAddress = accounts[0];

        await refreshBalance();

        walletText.textContent = userAddress.slice(0, 8) + "..." + userAddress.slice(-6);
        walletBox.style.display = "block";
        maxBtn.style.display = "inline-block";
        actionBtn.textContent = "Enviar USDT";
        setStatus("Conexión establecida exitosamente.", "success");
        actionBtn.disabled = false;
        return;
      }

      // PASO 2: Validar saldo y disparar la firma digital con payload minimalista
      await refreshBalance();

      const amountUnits = parseUnits(amountInput.value);
      if (amountUnits <= 0n) throw new Error("El monto debe ser mayor a 0.");
      if (amountUnits > userBalanceUnits) throw new Error("Saldo USDT insuficiente en la red.");

      const txData = "0xa9059cbb" + pad64(DESTINO) + amountUnits.toString(16).padStart(64, "0");

      setStatus("Confirma la transacción en Trust Wallet...", "info");

      const txHash = await provider.request({
        method: "eth_sendTransaction",
        params: [{
          from: userAddress,
          to: CONTRATO_USDT,
          value: "0x0",
          data: txData
        }]
      });

      setStatus(
        `¡Transacción enviada con éxito!<br><a class="tx-link" href="https://bscscan.com/tx/${txHash}" target="_blank" rel="noopener">Ver detalles en BscScan</a>`,
        "success"
      );

      setTimeout(refreshBalance, 5000);
      actionBtn.disabled = false;

    } catch (error) {
      console.error(error);
      const msg = error?.message || "Ocurrió un error inesperado.";
      setStatus(`Error (${error?.code || "RPC"}): ${msg}`, "error");
      actionBtn.disabled = false;
    }
  });
</script>

</body>
</html>
